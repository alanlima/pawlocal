<text x="90" y="1252" font-size="24" fill="#23344a" font-weight="400">One attempt / lease. 20 min to PR; proposed 60 min CI→recovery. Failed, stale or unknown work → escalation.</text>
<text x="90" y="1292" font-size="23" fill="#23344a" font-weight="400">Both model envelopes reserved upfront; monthly and request/cumulative bounds enforced; unset configuration denies admission.</text>
