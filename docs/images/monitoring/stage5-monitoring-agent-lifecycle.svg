<rect x="64" y="1170" width="2072" height="184" rx="18" fill="#fff0d6" stroke="#dfbe80"/>
<text x="90" y="1212" font-size="26" fill="#755017" font-weight="700">BOUNDED ATTEMPT / EXPLICIT DELIVERY LIMITS</text>
<text x="90" y="1252" font-size="24" fill="#23344a" font-weight="400">One attempt / lease. 20 min to PR; proposed 60 min CI→recovery. Failed, stale or unknown work → escalation.</text>
<text x="90" y="1292" font-size="23" fill="#23344a" font-weight="400">Both model envelopes reserved upfront; monthly and request/cumulative bounds enforced; unset configuration denies admission.</text>
<text x="90" y="1330" font-size="23" fill="#23344a" font-weight="400">Resolved alerts update incident state; current state is checked before coding and publishing. Test dispatch-loss / retry / duplicate behavior.</text>
<text x="64" y="1400" font-size="22" fill="#4a607a" font-weight="400">Lambda receives; GitHub runs agents. Trusted jobs automate merge/release; models hold no publication or deployment credentials.</text>
