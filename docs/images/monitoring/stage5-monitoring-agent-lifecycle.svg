<text x="1238" y="566" font-size="23" fill="#214665" font-weight="700">VERIFY DEVELOPMENT</text>
<text x="1238" y="603" font-size="23" fill="#23344a" font-weight="400">Existing fullstack-release.yml → live checks</text>
<text x="1238" y="638" font-size="21" fill="#52677f" font-weight="400">Deploy immutable release; verify original regression.</text>
