<text x="64" y="65" font-size="41" fill="#ffffff" font-weight="700">PawLocal · Incident &amp; agent lifecycle</text>
<text x="64" y="110" font-size="24" fill="#b8cce3" font-weight="400">Direct telemetry + one authenticated webhook function + GitHub-hosted jobs • finite cloud execution</text>
<text x="64" y="145" font-size="20" fill="#76d2ca" font-weight="600">OWNER-APPROVED MVP CONTRACT  |  23 OCT 2026  |  #239 · #59 → #42</text>
