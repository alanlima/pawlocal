<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2200" height="1430" viewBox="0 0 2200 1430" role="img" aria-label="PawLocal · Incident &amp; agent lifecycle"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#60758d"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif">
