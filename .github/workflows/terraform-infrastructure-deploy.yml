name: Terraform infrastructure deployment

on:
  workflow_dispatch:

permissions:
  contents: read

# The Terraform root and backend state are shared by both environments.
# Serialize the entire dev-to-prod run and retain Terraform's S3 lock file.
concurrency:
  group: pawlocal-terraform-infrastructure
  cancel-in-progress: false

jobs:
  plan-development:
    name: Plan development and publish review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.checksum.outputs.sha256 }}
      review_sha256: ${{ steps.checksum.outputs.review_sha256 }}
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      TF_VAR_certificate_arn: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_VAR_terraform_state_bucket_name: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      TF_VAR_backend_image_digests: >-
        {"development":"${{ vars.PAWLOCAL_TF_DEVELOPMENT_IMAGE }}","production":"${{ vars.PAWLOCAL_TF_PRODUCTION_IMAGE }}"}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require configured Terraform inputs
        env:
          ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_PLAN_ROLE_ARN }}
          DEVELOPMENT_IMAGE: ${{ vars.PAWLOCAL_TF_DEVELOPMENT_IMAGE }}
          PRODUCTION_IMAGE: ${{ vars.PAWLOCAL_TF_PRODUCTION_IMAGE }}
        run: |
          test -n "$AWS_REGION"
          test -n "$PAWLOCAL_TF_STATE_BUCKET"
          test -n "$TF_VAR_domain_name"
          test -n "$TF_VAR_certificate_arn"
          test -n "$ROLE_ARN"
          test -n "$DEVELOPMENT_IMAGE"
          test -n "$PRODUCTION_IMAGE"

      - name: Configure short-lived planning credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PAWLOCAL_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: PawLocalDevPlan-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Initialize existing shared state
        run: |
          terraform init -input=false \
            -backend-config="bucket=$PAWLOCAL_TF_STATE_BUCKET" \
            -backend-config='key=pawlocal/terraform.tfstate' \
            -backend-config="region=$AWS_REGION" \
            -backend-config='encrypt=true' \
            -backend-config='use_lockfile=true'

      - name: Create development plan
        run: terraform plan -input=false -lock-timeout=5m -no-color -out=development.tfplan

      - name: Check development plan isolation and safety
        run: |
          terraform show -json development.tfplan > development-plan.json
          python ../../ops/validate-terraform-environment-plan.py \
            --environment development --plan-json development-plan.json

      - name: Render review output
        run: terraform show -no-color development.tfplan > development-plan-review.txt

      - name: Hash saved plan
        id: checksum
        run: |
          echo "sha256=$(sha256sum development.tfplan | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "review_sha256=$(sha256sum development-plan-review.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload saved plan and review output
        uses: actions/upload-artifact@v4
        with:
          name: pawlocal-development-terraform-plan-${{ github.run_id }}
          path: |
            infra/terraform/development.tfplan
            infra/terraform/development-plan-review.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish plan review location
        env:
          PLAN_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          {
            echo '### Development Terraform plan ready for review'
            echo
            echo 'Open the run artifacts and inspect `development-plan-review.txt` before approving the pending `development` deployment job.'
            echo
            echo "Saved plan SHA-256: \`$PLAN_SHA256\`"
            echo 'The workflow stops if any production, shared, destructive, replacement, or unclassified resource change is present.'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-development:
    name: Apply reviewed development plan
    needs: plan-development
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure short-lived apply credentials
        env:
          APPLY_ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN }}
        run: test -n "$APPLY_ROLE_ARN"

      - name: Assume the environment-scoped Terraform apply role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: PawLocalDevApply-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Initialize existing shared state
        run: |
          terraform init -input=false \
            -backend-config="bucket=$PAWLOCAL_TF_STATE_BUCKET" \
            -backend-config='key=pawlocal/terraform.tfstate' \
            -backend-config="region=$AWS_REGION" \
            -backend-config='encrypt=true' \
            -backend-config='use_lockfile=true'

      - name: Download the reviewed development plan
        uses: actions/download-artifact@v4
        with:
          name: pawlocal-development-terraform-plan-${{ github.run_id }}
          path: infra/terraform

      - name: Verify plan integrity
        env:
          EXPECTED_SHA256: ${{ needs.plan-development.outputs.plan_sha256 }}
        run: |
          python ../../ops/verify-terraform-plan-artifact.py --file development.tfplan --expected-sha256 "$EXPECTED_SHA256"
          python ../../ops/verify-terraform-plan-artifact.py --file development-plan-review.txt --expected-sha256 "${{ needs.plan-development.outputs.review_sha256 }}"

      - name: Apply exactly the reviewed development plan
        run: terraform apply -input=false -lock-timeout=5m -no-color development.tfplan

  verify-development:
    name: Verify development before production planning
    needs: apply-development
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check development health
        env:
          HEALTH_URL: ${{ vars.PAWLOCAL_DEVELOPMENT_API_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          status="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-connrefused -o /dev/null -w '%{http_code}' "$HEALTH_URL")"
          test "$status" = "200"
          echo "Development health check: HTTP $status" >> "$GITHUB_STEP_SUMMARY"

  plan-production:
    name: Create fresh production plan and publish review
    needs: verify-development
    runs-on: ubuntu-latest
    environment: production-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.checksum.outputs.sha256 }}
      review_sha256: ${{ steps.checksum.outputs.review_sha256 }}
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      TF_VAR_certificate_arn: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_VAR_terraform_state_bucket_name: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      TF_VAR_backend_image_digests: >-
        {"development":"${{ vars.PAWLOCAL_TF_DEVELOPMENT_IMAGE }}","production":"${{ vars.PAWLOCAL_TF_PRODUCTION_IMAGE }}"}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require configured Terraform inputs
        env:
          ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_PLAN_ROLE_ARN }}
          DEVELOPMENT_IMAGE: ${{ vars.PAWLOCAL_TF_DEVELOPMENT_IMAGE }}
          PRODUCTION_IMAGE: ${{ vars.PAWLOCAL_TF_PRODUCTION_IMAGE }}
        run: |
          test -n "$AWS_REGION"
          test -n "$PAWLOCAL_TF_STATE_BUCKET"
          test -n "$TF_VAR_domain_name"
          test -n "$TF_VAR_certificate_arn"
          test -n "$ROLE_ARN"
          test -n "$DEVELOPMENT_IMAGE"
          test -n "$PRODUCTION_IMAGE"

      - name: Configure short-lived planning credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PAWLOCAL_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: PawLocalProdPlan-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Initialize existing shared state
        run: |
          terraform init -input=false \
            -backend-config="bucket=$PAWLOCAL_TF_STATE_BUCKET" \
            -backend-config='key=pawlocal/terraform.tfstate' \
            -backend-config="region=$AWS_REGION" \
            -backend-config='encrypt=true' \
            -backend-config='use_lockfile=true'

      - name: Create fresh production plan after development verification
        run: terraform plan -input=false -lock-timeout=5m -no-color -out=production.tfplan

      - name: Check production plan isolation and safety
        run: |
          terraform show -json production.tfplan > production-plan.json
          python ../../ops/validate-terraform-environment-plan.py \
            --environment production --plan-json production-plan.json

      - name: Render review output
        run: terraform show -no-color production.tfplan > production-plan-review.txt

      - name: Hash saved plan
        id: checksum
        run: |
          echo "sha256=$(sha256sum production.tfplan | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "review_sha256=$(sha256sum production-plan-review.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload saved plan and review output
        uses: actions/upload-artifact@v4
        with:
          name: pawlocal-production-terraform-plan-${{ github.run_id }}
          path: |
            infra/terraform/production.tfplan
            infra/terraform/production-plan-review.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish plan review location
        env:
          PLAN_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          {
            echo '### Production Terraform plan ready for review'
            echo
            echo 'Open the run artifacts and inspect `production-plan-review.txt` before approving the pending `production` deployment job.'
            echo
            echo "Saved plan SHA-256: \`$PLAN_SHA256\`"
            echo 'The workflow stops if any development, shared, destructive, replacement, or unclassified resource change is present.'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-production:
    name: Apply reviewed production plan
    needs: plan-production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure short-lived apply credentials
        env:
          APPLY_ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN }}
        run: test -n "$APPLY_ROLE_ARN"

      - name: Assume the environment-scoped Terraform apply role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: PawLocalProdApply-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Initialize existing shared state
        run: |
          terraform init -input=false \
            -backend-config="bucket=$PAWLOCAL_TF_STATE_BUCKET" \
            -backend-config='key=pawlocal/terraform.tfstate' \
            -backend-config="region=$AWS_REGION" \
            -backend-config='encrypt=true' \
            -backend-config='use_lockfile=true'

      - name: Download the reviewed production plan
        uses: actions/download-artifact@v4
        with:
          name: pawlocal-production-terraform-plan-${{ github.run_id }}
          path: infra/terraform

      - name: Verify plan integrity
        env:
          EXPECTED_SHA256: ${{ needs.plan-production.outputs.plan_sha256 }}
        run: |
          python ../../ops/verify-terraform-plan-artifact.py --file production.tfplan --expected-sha256 "$EXPECTED_SHA256"
          python ../../ops/verify-terraform-plan-artifact.py --file production-plan-review.txt --expected-sha256 "${{ needs.plan-production.outputs.review_sha256 }}"

      - name: Apply exactly the reviewed production plan
        run: terraform apply -input=false -lock-timeout=5m -no-color production.tfplan

  verify-production:
    name: Verify production after apply
    needs: apply-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check production health
        env:
          HEALTH_URL: ${{ vars.PAWLOCAL_PRODUCTION_API_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          status="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-connrefused -o /dev/null -w '%{http_code}' "$HEALTH_URL")"
          test "$status" = "200"
          echo "Production health check: HTTP $status" >> "$GITHUB_STEP_SUMMARY"
