name: Terraform infrastructure deployment (blocked)

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow intentionally fails closed. The repository has no authorized
# GitHub Actions identity that can bootstrap a full-stack Terraform apply role.
# Do not add AWS credentials or enable an apply job until the owner-approved,
# Terraform-managed bootstrap path is reviewed and present in the repository.
jobs:
  bootstrap-blocker:
    name: Report Terraform role bootstrap blocker
    runs-on: ubuntu-latest
    steps:
      - name: Explain why infrastructure deployment is disabled
        shell: bash
        run: |
          {
            echo '### Terraform infrastructure deployment is blocked'
            echo
            echo 'No authorized GitHub Actions Terraform bootstrap role is defined in the tracked configuration.'
            echo 'The current container deployment role cannot create or update IAM roles and policies, and no approved bootstrap identity is recorded.'
            echo
            echo 'Next steps: the owner must identify an authorized GitHub Actions OIDC principal and approve its Terraform-managed, least-privilege role/bootstrap design. Then review the exact Terraform state ownership and plan before enabling a planning/apply pipeline.'
            echo 'No AWS credentials were requested, and no Terraform plan or apply was run.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error title=Terraform deployment disabled::Missing authorized Terraform IAM bootstrap role; see summary for required owner decision.'
          exit 1
