name: Terraform development deployment
run-name: PawLocal development deployment ${{ inputs.backend_image_digest }}

on:
  workflow_dispatch:
    inputs:
      backend_image_digest:
        description: Immutable public GHCR API image reference, pinned to a sha256 digest.
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Serialize every infrastructure writer. Apply jobs never cancel an in-flight
# Terraform operation, and production cannot plan until development is verified.
concurrency:
  group: pawlocal-infrastructure
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.10.5

jobs:
  validate-ref:
    name: Restrict infrastructure deployment to main
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'This workflow may only be dispatched from main.' >&2
            exit 1
          fi

  development-plan:
    name: Plan development infrastructure
    needs: validate-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.digest.outputs.plan_sha256 }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      PAWLOCAL_TERRAFORM_ROLE_ARN: ${{ vars.PAWLOCAL_DEVELOPMENT_TERRAFORM_PLAN_ROLE_ARN }}
      PAWLOCAL_TF_PLAN_BUCKET: ${{ vars.PAWLOCAL_TF_PLAN_BUCKET }}
      PAWLOCAL_OAC_ARN: ${{ vars.PAWLOCAL_DEVELOPMENT_OAC_ARN }}
      PAWLOCAL_IDENTITY_PLAN_ROLE_ARN: ${{ vars.PAWLOCAL_IDENTITY_TERRAFORM_PLAN_ROLE_ARN }}
      BACKEND_IMAGE_DIGEST: ${{ inputs.backend_image_digest }}
      TF_PLAN_OBJECT_KEY: plans/development/${{ github.run_id }}/${{ github.run_attempt }}/tfplan
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_root_domain: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      TF_VAR_cloudfront_certificate_arn: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_VAR_terraform_state_bucket_name: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      TF_VAR_backend_image_digest: ${{ inputs.backend_image_digest }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout and required configuration
        shell: bash
        env:
          BACKEND_IMAGE_DIGEST: ${{ inputs.backend_image_digest }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$AWS_REGION"
          [[ "$PAWLOCAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$PAWLOCAL_TERRAFORM_ROLE_ARN" =~ ^arn:[^:]+:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/pawlocal-development-terraform-plan$ ]]
          test -n "$PAWLOCAL_TF_STATE_BUCKET"
          test -n "$PAWLOCAL_TF_PLAN_BUCKET"
          test -n "$TF_VAR_root_domain"
          test -n "$TF_VAR_cloudfront_certificate_arn"
          [[ -z "$BACKEND_IMAGE_DIGEST" || "$BACKEND_IMAGE_DIGEST" =~ ^ghcr\.io/alanlima/pawlocal-api@sha256:[0-9a-f]{64}$ ]]

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure identity plan role to read the applied DSQL runtime identity
        if: env.BACKEND_IMAGE_DIGEST != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PAWLOCAL_IDENTITY_PLAN_ROLE_ARN }}
          role-session-name: pawlocal-dev-runtime-identity-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Require the applied development DSQL runtime identity
        if: env.BACKEND_IMAGE_DIGEST != ''
        working-directory: infra/terraform/identity
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" \
            -backend-config='key=pawlocal/identity/terraform.tfstate' \
            -backend-config="region=${AWS_REGION}" \
            -backend-config='use_lockfile=true' > "$RUNNER_TEMP/identity-output-init.log" 2>&1
          terraform output -json role_arns > "$RUNNER_TEMP/identity-role-arns.json"
          python - "$RUNNER_TEMP/identity-role-arns.json" "$PAWLOCAL_AWS_ACCOUNT_ID" <<'PY' >> "$GITHUB_ENV"
          import json, sys
          roles = json.load(open(sys.argv[1]))
          arn = roles.get("development_dsql_runtime")
          expected = f"arn:aws:iam::{sys.argv[2]}:role/pawlocal-development-dsql-runtime"
          if arn != expected:
              raise SystemExit("The applied identity state does not contain the exact development DSQL runtime role")
          print(f"TF_VAR_dsql_runtime_role_arn={arn}")
          PY

      - name: Configure development plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PAWLOCAL_TERRAFORM_ROLE_ARN }}
          role-session-name: pawlocal-dev-tf-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize development state and create saved plan
        working-directory: infra/terraform/environments/development
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" \
            -backend-config='key=pawlocal/development/terraform.tfstate' \
            -backend-config="region=${AWS_REGION}" \
            -backend-config='use_lockfile=true'
          existing_oac_arn="$(terraform output -raw oac_arn 2>/dev/null || true)"
          if [[ -n "$existing_oac_arn" ]]; then
            [[ -n "$PAWLOCAL_OAC_ARN" && "$PAWLOCAL_OAC_ARN" == "$existing_oac_arn" ]] || {
              echo 'Development OAC policy ARN is missing or does not match Terraform state; apply the reviewed bootstrap policy and set PAWLOCAL_OAC_ARN before another deployment run.' >&2
              exit 1
            }
          fi
          if ! terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan > "$RUNNER_TEMP/terraform-plan-output.txt" 2>&1; then
            echo 'Terraform plan failed; raw Terraform output was withheld from this public workflow log.' >&2
            exit 1
          fi

      - name: Publish sanitized development plan for review
        working-directory: infra/terraform/environments/development
        shell: bash
        run: |
          set -o pipefail
          {
            echo '## Development Terraform plan review'
            echo
            echo "Commit: `${GITHUB_SHA}`"
            echo "State: `pawlocal/development/terraform.tfstate`"
            echo 'Changed resource addresses, actions, and attribute paths are shown; values are omitted.'
            if ! terraform show -json tfplan 2>"$RUNNER_TEMP/terraform-show-error.txt" | python ../../../../ops/terraform-plan-review.py --environment development; then
              echo 'Terraform plan review could not be safely rendered; raw output was withheld.' >&2
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Calculate saved-plan digest
        id: digest
        working-directory: infra/terraform/environments/development
        shell: bash
        run: |
          digest="$(sha256sum tfplan | cut -d ' ' -f 1)"
          echo "plan_sha256=${digest}" >> "$GITHUB_OUTPUT"
          echo "Saved plan SHA-256: `${digest}`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact development plan to the private Terraform plan prefix
        env:
          PLAN_SHA256: ${{ steps.digest.outputs.plan_sha256 }}
        run: |
          python -m pip install --disable-pip-version-check boto3==1.35.99
          python ops/terraform-plan-object.py upload \
            --bucket "$PAWLOCAL_TF_PLAN_BUCKET" \
            --key "$TF_PLAN_OBJECT_KEY" \
            --file infra/terraform/environments/development/tfplan \
            --environment development \
            --state-key pawlocal/development/terraform.tfstate \
            --commit "$GITHUB_SHA" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --sha256 "$PLAN_SHA256"

  development-apply:
    name: Apply reviewed development plan
    needs: development-plan
    runs-on: ubuntu-latest
    # Configure this GitHub Environment with required reviewers, main-only
    # deployment branches, and the matching development apply role ARN.
    environment: development-apply
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      PAWLOCAL_TERRAFORM_ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_ROLE_ARN }}
      PAWLOCAL_TF_PLAN_BUCKET: ${{ vars.PAWLOCAL_TF_PLAN_BUCKET }}
      PAWLOCAL_OAC_ARN: ${{ vars.PAWLOCAL_DEVELOPMENT_OAC_ARN }}
      TF_PLAN_OBJECT_KEY: plans/development/${{ github.run_id }}/${{ github.run_attempt }}/tfplan
    steps:
      - name: Check out the planned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout and artifact digest
        shell: bash
        env:
          EXPECTED_PLAN_SHA256: ${{ needs.development-plan.outputs.plan_sha256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$EXPECTED_PLAN_SHA256"
          [[ "$PAWLOCAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$PAWLOCAL_TERRAFORM_ROLE_ARN" =~ ^arn:[^:]+:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/pawlocal-development-terraform-apply$ ]]

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure development apply role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PAWLOCAL_TERRAFORM_ROLE_ARN }}
          role-session-name: pawlocal-dev-tf-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download and verify exact development plan from private S3
        env:
          EXPECTED_PLAN_SHA256: ${{ needs.development-plan.outputs.plan_sha256 }}
        run: |
          python -m pip install --disable-pip-version-check boto3==1.35.99
          python ops/terraform-plan-object.py download \
            --bucket "$PAWLOCAL_TF_PLAN_BUCKET" \
            --key "$TF_PLAN_OBJECT_KEY" \
            --file infra/terraform/environments/development/tfplan \
            --environment development \
            --state-key pawlocal/development/terraform.tfstate \
            --commit "$GITHUB_SHA" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --sha256 "$EXPECTED_PLAN_SHA256"

      - name: Initialize development state
        working-directory: infra/terraform/environments/development
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" \
            -backend-config='key=pawlocal/development/terraform.tfstate' \
            -backend-config="region=${AWS_REGION}" \
            -backend-config='use_lockfile=true'
          existing_oac_arn="$(terraform output -raw oac_arn 2>/dev/null || true)"
          if [[ -n "$existing_oac_arn" ]]; then
            [[ -n "$PAWLOCAL_OAC_ARN" && "$PAWLOCAL_OAC_ARN" == "$existing_oac_arn" ]] || {
              echo 'Development OAC policy ARN is missing or does not match Terraform state; apply the reviewed bootstrap policy before continuing.' >&2
              exit 1
            }
          fi

      - name: Apply the exact reviewed development plan
        working-directory: infra/terraform/environments/development
        shell: bash
        run: |
          if ! terraform apply -input=false -lock-timeout=5m -auto-approve tfplan > "$RUNNER_TEMP/terraform-apply-output.txt" 2>&1; then
            echo 'Development Terraform apply failed; raw provider output was withheld from this public workflow log.' >&2
            exit 1
          fi
          echo 'Development Terraform apply completed.'

      - name: Publish OAC identifier for bootstrap policy refresh
        working-directory: infra/terraform/environments/development
        shell: bash
        run: |
          oac_arn="$(terraform output -raw oac_arn)"
          echo "Development OAC ARN for the separate bootstrap policy: `${oac_arn}`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify development API and database-backed place query
        if: inputs.backend_image_digest != ''
        working-directory: infra/terraform/environments/development
        env:
          EXPECTED_IMAGE_DIGEST: ${{ inputs.backend_image_digest }}
        shell: bash
        run: |
          terraform output -json environment_targets > "$RUNNER_TEMP/development-targets.json"
          api_health_url="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["development"]["api_health_url"])' "$RUNNER_TEMP/development-targets.json")"
          api_base_url="${api_health_url%/health}"
          expected_digest="${EXPECTED_IMAGE_DIGEST##*@}"
          health_file="$RUNNER_TEMP/development-health.json"
          places_file="$RUNNER_TEMP/development-places.json"

          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 15 "$api_health_url" --output "$health_file"; then
              break
            fi
            if [[ "$attempt" == 24 ]]; then
              echo 'Development API health endpoint did not become available.' >&2
              exit 1
            fi
            sleep 10
          done

          python - "$health_file" "$expected_digest" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          if payload.get("status") != "ok" or payload.get("environment") != "development":
              raise SystemExit("Health response did not identify a healthy development API")
          if payload.get("image_digest") != sys.argv[2]:
              raise SystemExit("Development API is not running the selected immutable image digest")
          PY

          places_url="${api_base_url}/api/v1/places?page_size=1"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 15 "$places_url" --output "$places_file"; then
              break
            fi
            if [[ "$attempt" == 24 ]]; then
              echo 'Development database-backed places query did not succeed.' >&2
              exit 1
            fi
            sleep 10
          done

          python - "$places_file" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          if not isinstance(payload.get("items"), list) or not isinstance(payload.get("total"), int):
              raise SystemExit("Places API response did not match the database-backed page contract")
          PY

          {
            echo 'Development API health and database-backed place query both passed.'
            echo "API image digest: \`${expected_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record development apply result
        if: inputs.backend_image_digest != ''
        shell: bash
        env:
          BACKEND_IMAGE_DIGEST: ${{ inputs.backend_image_digest }}
        run: |
          echo 'Development apply succeeded for the reviewed saved plan.' >> "$GITHUB_STEP_SUMMARY"
          echo "Development workflow run ID: `${GITHUB_RUN_ID}`" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable API image: `${BACKEND_IMAGE_DIGEST}`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: `${GITHUB_SHA}`" >> "$GITHUB_STEP_SUMMARY"

      - name: Record development foundation handoff
        if: inputs.backend_image_digest == ''
        shell: bash
        run: |
          {
            echo 'Development foundation applied from the sanitized exact plan.'
            echo 'Next pin the development OAC and complete the local bootstrap update, then run the identity workflow for development. Dispatch this workflow again with an immutable backend image digest after identity-apply succeeds.'
          } >> "$GITHUB_STEP_SUMMARY"
