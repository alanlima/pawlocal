name: Infrastructure · Plan and apply environment
run-name: 'Infrastructure · Plan and apply environment · ${{ github.ref_name }} · ${{ github.sha }}'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: PawLocal environment to plan and apply.
        required: true
        type: choice
        options: [development, production]
      phase:
        description: Explicit lifecycle phase; foundation creates no runtime deployment.
        required: true
        default: foundation
        type: choice
        options: [foundation, converge, release]
      backend_image:
        description: Optional immutable ghcr.io/alanlima/pawlocal-api digest reference.
        required: false
        type: string
      release_commit:
        description: Development-verified main commit; required for production.
        required: false
        type: string
      release_only:
        description: Reject any change except the environment container deployment version.
        required: true
        default: false
        type: boolean
  workflow_call:
    secrets:
      PAWLOCAL_CONFIG_GITHUB_TOKEN:
        required: true
      PAWLOCAL_CLOUDFRONT_CERTIFICATE_ARN:
        required: false
      GRAFANA_CLOUD_ACCESS_POLICY_TOKEN:
        required: false
      GRAFANA_SERVICE_ACCOUNT_TOKEN:
        required: false
    outputs:
      frontend_config:
        value: ${{ jobs.reconcile-after-apply.outputs.frontend_config }}
    inputs:
      environment:
        required: true
        type: string
      phase:
        required: false
        default: release
        type: string
      backend_image:
        required: false
        default: ""
        type: string
      release_commit:
        required: false
        default: ""
        type: string
      release_only:
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: ${{ contains(fromJSON('["Release · Publish and verify development","Release · Promote verified release to production"]'), github.workflow) && format('pawlocal-terraform-{0}', inputs.environment) || format('pawlocal-lifecycle-{0}', inputs.environment) }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.14.3
  PAWLOCAL_TERRAFORM_DIAGNOSTIC_LOGS: ${{ vars.PAWLOCAL_TERRAFORM_DIAGNOSTIC_LOGS }}
  TF_ROOT: infra/terraform/environments/${{ inputs.environment }}
  TF_STATE_KEY: pawlocal/${{ inputs.environment }}/terraform.tfstate
  TF_VAR_project_name: pawlocal
  PLAN_PREFIX: plans/${{ inputs.environment }}/${{ github.run_id }}/${{ github.run_attempt }}

jobs:
  production-eligibility:
    name: Require a verified development release
    if: inputs.environment == 'production' && inputs.phase != 'foundation'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the selected development deployment
        uses: actions/github-script@v9
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
        with:
          script: |
            const commit = process.env.RELEASE_COMMIT
            const image = process.env.BACKEND_IMAGE
            if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error('Production requires a full development-verified commit SHA')
            if (!/^ghcr\.io\/alanlima\/pawlocal-api@sha256:[0-9a-f]{64}$/.test(image)) throw new Error('Production requires a valid immutable backend image')

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${commit}...main`,
            })
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              throw new Error('Selected development release commit is not in main history')
            }

            const expectedWorkflow = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'fullstack-release.yml',
            })
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment: 'development', ref: commit, per_page: 100,
            })
            for (const deployment of deployments) {
              let payload = deployment.payload || {}
              if (typeof payload === 'string') {
                try { payload = JSON.parse(payload) } catch { continue }
              }
              if (!payload || typeof payload !== 'object' || Array.isArray(payload)) continue
              if (!Number.isSafeInteger(payload.workflow_run_id) || payload.workflow_run_id < 1 ||
                  !Number.isSafeInteger(payload.workflow_run_attempt) || payload.workflow_run_attempt < 1) continue
              const evidenceMatches = payload.record_schema_version === 1 &&
                ((payload.manifest_schema_version === 2 && payload.evidence_schema_version === 1 &&
                  !Object.hasOwn(payload, 'frontend_telemetry_enabled')) ||
                 (payload.manifest_schema_version === 3 && payload.evidence_schema_version === 2 &&
                  typeof payload.frontend_telemetry_enabled === 'boolean')) &&
                payload.evidence_validated === true &&
                deployment.sha === commit && deployment.environment === 'development' &&
                deployment.repository_url === `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}` &&
                deployment.creator?.login === 'github-actions[bot]' &&
                payload.release_commit === commit &&
                /^sha256:[0-9a-f]{64}$/.test(payload.release_manifest_digest || '') &&
                /^sha256:[0-9a-f]{64}$/.test(payload.verification_evidence_digest || '') &&
                payload.backend_image === image &&
                payload.backend_image_digest === image.split('@', 2)[1] &&
                payload.running_image_digest === payload.backend_image_digest &&
                /^sha256:[0-9a-f]{64}$/.test(payload.frontend_artifact_digest || '') &&
                payload.database_provider === 'aurora_dsql' &&
                payload.migration_runner === 'dsql_baseline' &&
                payload.migration_id === 'dsql_0001_initial' &&
                typeof payload.telemetry_enabled === 'boolean' &&
                payload.public_endpoint_health?.frontend === true &&
                payload.public_endpoint_health?.api === true &&
                payload.database_query_smoke?.route === '/api/v1/places' &&
                payload.database_query_smoke?.result === 'valid_place_page'
              if (!evidenceMatches) continue
              // Bind historical evidence to its exact attempt, even if a later rerun failed.
              const {data: producer} = await github.rest.actions.getWorkflowRunAttempt({
                ...context.repo, run_id: payload.workflow_run_id, attempt_number: payload.workflow_run_attempt,
              })
              const producerMatches = producer.id === payload.workflow_run_id &&
                producer.workflow_id === expectedWorkflow.data.id &&
                producer.repository?.id === context.payload.repository.id &&
                producer.head_repository?.id === context.payload.repository.id &&
                producer.path === '.github/workflows/fullstack-release.yml' &&
                producer.head_sha === commit && producer.head_branch === 'main' &&
                ['push', 'workflow_dispatch'].includes(producer.event) && producer.conclusion === 'success' &&
                producer.status === 'completed' && producer.run_attempt === payload.workflow_run_attempt
              const statuses = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deployment.id, per_page: 100,
              })
              // Retirement preserves a prior success; never cross a failed or unknown status.
              const history = statuses.data
              const validHistory = Array.isArray(history) && history.length > 0 && history.length < 100 &&
                history.every(item => item && Number.isFinite(Date.parse(item.created_at)))
              const ordered = validHistory ? [...history].sort((a, b) =>
                Date.parse(b.created_at) - Date.parse(a.created_at)) : []
              let successfulHistory = false
              for (const status of ordered) {
                if (status.creator?.login !== 'github-actions[bot]') break
                if (status.state === 'success') { successfulHistory = true; break }
                if (status.state !== 'inactive') break
              }
              if (successfulHistory && producerMatches) return
            }
            throw new Error('No successful development deployment has matching validated full-stack release evidence')

  reconcile-preflight:
    needs: production-eligibility
    if: ${{ !cancelled() && inputs.phase != 'foundation' && (inputs.environment == 'development' || needs.production-eligibility.result == 'success') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reconcile-environment.yml
    with:
      environment: ${{ inputs.environment }}
      mode: enforce
      fail_on_error: false
      caller_holds_lifecycle_lock: true
    secrets:
      PAWLOCAL_CONFIG_GITHUB_TOKEN: ${{ secrets.PAWLOCAL_CONFIG_GITHUB_TOKEN }}

  plan:
    name: Plan ${{ inputs.environment }}
    if: ${{ !cancelled() && (inputs.phase == 'foundation' || needs.reconcile-preflight.result == 'success') && (inputs.environment == 'development' || inputs.phase == 'foundation' || needs.production-eligibility.result == 'success') }}
    needs: [production-eligibility, reconcile-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.metadata.outputs.plan_sha256 }}
      grafana_url: ${{ steps.hosted-bindings.outputs.grafana_url }}
    env:
      AWS_PARTITION: aws
      AWS_REGION: ${{ vars.AWS_REGION }}
      COGNITO_TERRAFORM_PURPOSE: plan
      TF_VAR_oncall_receiver: ${{ vars.PAWLOCAL_ONCALL_RECEIVER_CONFIG || 'null' }}
      TF_VAR_hosted_observability: ${{ vars.PAWLOCAL_HOSTED_OBSERVABILITY_CONFIG || 'null' }}
      PAWLOCAL_ENVIRONMENT: ${{ inputs.environment }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      PLAN_TRANSFER_BUCKET: ${{ fromJSON(needs.reconcile-preflight.outputs.configuration || '{}').PAWLOCAL_TERRAFORM_PLAN_BUCKET || vars.PAWLOCAL_TERRAFORM_PLAN_BUCKET }}
      TERRAFORM_ROLE_ARN: ${{ fromJSON(needs.reconcile-preflight.outputs.configuration || '{}').PAWLOCAL_TERRAFORM_PLAN_ROLE_ARN || vars.PAWLOCAL_TERRAFORM_PLAN_ROLE_ARN }}
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ fromJSON(needs.reconcile-preflight.outputs.configuration || '{}').PAWLOCAL_AWS_ACCOUNT_ID || vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_root_domain: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ vars.PAWLOCAL_ROUTE53_ZONE_ID }}
      TF_VAR_cloudfront_certificate_arn: ${{ secrets.PAWLOCAL_CLOUDFRONT_CERTIFICATE_ARN }}
      TF_VAR_runtime_role_arn: ${{ fromJSON(needs.reconcile-preflight.outputs.configuration || '{}').PAWLOCAL_RUNTIME_ROLE_ARN || vars.PAWLOCAL_RUNTIME_ROLE_ARN }}
      TF_VAR_cloudfront_distribution_arn: ${{ fromJSON(needs.reconcile-preflight.outputs.configuration || '{}').PAWLOCAL_CLOUDFRONT_DISTRIBUTION_ARN || vars.PAWLOCAL_CLOUDFRONT_DISTRIBUTION_ARN }}
      TF_VAR_cloudfront_oac_arn: ${{ fromJSON(needs.reconcile-preflight.outputs.configuration || '{}').PAWLOCAL_CLOUDFRONT_OAC_ARN || vars.PAWLOCAL_CLOUDFRONT_OAC_ARN }}
      TF_VAR_backend_image: ${{ inputs.backend_image }}
      GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      GRAFANA_AUTH: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
      GRAFANA_URL: ${{ (vars.PAWLOCAL_HOSTED_OBSERVABILITY_CONFIG != '' && vars.PAWLOCAL_HOSTED_OBSERVABILITY_CONFIG != 'null' && fromJSON(vars.PAWLOCAL_HOSTED_OBSERVABILITY_CONFIG).stack_url) || '' }}
    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact clean source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Report unavailable reconciliation
        if: inputs.phase != 'foundation' && needs.reconcile-preflight.outputs.configuration == ''
        run: echo '::warning::Configuration synchronization was unavailable. Terraform will use existing protected Environment variables; required inputs and review approval remain enforced.'

      - name: Validate selection and required configuration
        shell: bash
        run: |
          [[ '${{ inputs.environment }}' =~ ^(development|production)$ ]]
          [[ '${{ inputs.phase }}' =~ ^(foundation|converge|release)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for name in AWS_REGION PAWLOCAL_TF_STATE_BUCKET PLAN_TRANSFER_BUCKET TF_VAR_root_domain TF_VAR_route53_zone_id TF_VAR_cloudfront_certificate_arn TERRAFORM_ROLE_ARN PAWLOCAL_AWS_ACCOUNT_ID; do
            [[ -n "${!name}" ]] || { echo "Missing required protected configuration: $name" >&2; exit 1; }
          done
          [[ "$PAWLOCAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$TERRAFORM_ROLE_ARN" == "arn:aws:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/pawlocal-${{ inputs.environment }}-terraform-plan" ]]
          if [[ -n "$TF_VAR_backend_image" ]]; then
            [[ "$TF_VAR_backend_image" =~ ^ghcr\.io/alanlima/pawlocal-api@sha256:[0-9a-f]{64}$ ]]
          fi
          if [[ '${{ inputs.phase }}' != 'foundation' ]]; then
            for name in TF_VAR_runtime_role_arn TF_VAR_cloudfront_distribution_arn TF_VAR_cloudfront_oac_arn; do
              [[ -n "${!name}" ]] || { echo "Missing required runtime configuration: $name" >&2; exit 1; }
            done
            [[ "$TF_VAR_runtime_role_arn" == "arn:aws:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/pawlocal-${{ inputs.environment }}-dsql-runtime" ]]
          fi
          case '${{ inputs.phase }}' in
            foundation)
              test '${{ inputs.release_only }}' = 'false'
              test -z '${{ inputs.backend_image }}'
              test -z '${{ inputs.release_commit }}'
              ;;
            converge)
              test '${{ inputs.release_only }}' = 'false'
              test -n '${{ inputs.backend_image }}'
              ;;
            release)
              test '${{ inputs.release_only }}' = 'true'
              test -n '${{ inputs.backend_image }}'
              ;;
          esac

      - name: Keep foundation free of generated runtime targets
        if: inputs.phase == 'foundation'
        shell: bash
        run: |
          {
            echo 'TF_VAR_runtime_role_arn='
            echo 'TF_VAR_cloudfront_distribution_arn='
            echo 'TF_VAR_cloudfront_oac_arn='
            echo 'TF_VAR_backend_image='
          } >> "$GITHUB_ENV"
          echo "Lifecycle phase: foundation (runtime deployment disabled)." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure read-only plan credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          allowed-account-ids: ${{ env.PAWLOCAL_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: "true"

      - name: Configure and verify delegated Cognito plan profile
        shell: bash
        run: bash .github/scripts/configure-cognito-terraform-profile.sh

      - name: Prepare optional on-call delegated profile
        shell: bash
        run: bash .github/scripts/configure-oncall-terraform-profile.sh
      - name: Install hosted observability validator dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r ops/configuration/requirements.txt
      - name: Validate public hosted bindings before Terraform planning
        id: hosted-bindings
        shell: bash
        run: python .github/scripts/validate-hosted-observability.py

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform-toolchain
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialize the matching clean state
        shell: bash
        run: |
          if python .github/scripts/terraform-command-output.py --log "$RUNNER_TEMP/terraform-init.log" -- \
            terraform -chdir="$TF_ROOT" init -input=false -reconfigure -lockfile=readonly \
              -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" \
              -backend-config="key=${TF_STATE_KEY}" \
              -backend-config="region=${AWS_REGION}" \
              -backend-config='encrypt=true' \
              -backend-config='use_lockfile=true'; then
            :
          else
            status=$?
            echo 'Terraform initialization failed; see the operation output above.' >&2
            exit "$status"
          fi

      - name: Create saved plan
        shell: bash
        run: |
          python .github/scripts/verify-terraform-source-checkout.py
          oncall_package_args=()
          if [[ "$TF_VAR_oncall_receiver" != 'null' ]]; then
            oncall_package_args+=(
              '-replace=module.pawlocal.module.oncall_receiver[0].local_file.archive_plan[0]'
              '-replace=module.pawlocal.module.oncall_receiver[0].null_resource.archive[0]'
            )
          fi
          if python .github/scripts/terraform-command-output.py --log "$RUNNER_TEMP/terraform-plan.log" -- \
            terraform -chdir="$TF_ROOT" plan -input=false -lock-timeout=5m -no-color -out=tfplan \
              -replace='module.pawlocal.module.cognito_pre_sign_up.local_file.archive_plan[0]' \
              -replace='module.pawlocal.module.cognito_pre_sign_up.null_resource.archive[0]' \
              "${oncall_package_args[@]}"; then
            :
          else
            status=$?
            echo 'Terraform planning failed; see the operation output above.' >&2
            exit "$status"
          fi
          terraform -chdir="$TF_ROOT" show -json tfplan > "$RUNNER_TEMP/terraform-plan.json" || {
              echo 'Saved plan JSON could not be rendered; see the Terraform error above.' >&2
              exit 1
            }

      - name: Reject existing keys before new parameter ownership
        run: |
          python -m pip install --disable-pip-version-check -r ops/configuration/requirements.txt
          python ops/configuration/check-collisions.py "$RUNNER_TEMP/terraform-plan.json" --environment '${{ inputs.environment }}'

      - name: Print sanitized saved-plan diagnostics
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_CONFIG_FILE: ""
          AWS_DEFAULT_REGION: ""
          AWS_REGION: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          COGNITO_DELEGATED_ROLE_ARN: ""
          COGNITO_DEPLOYMENT_PROFILE: ""
          COGNITO_TERRAFORM_PURPOSE: ""
          GRAFANA_AUTH: ""
          GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ""
          PAWLOCAL_AWS_ACCOUNT_ID: ""
          PAWLOCAL_TF_STATE_BUCKET: ""
          PLAN_PREFIX: ""
          PLAN_TRANSFER_BUCKET: ""
          TERRAFORM_ROLE_ARN: ""
          TF_ROOT: ""
          TF_STATE_KEY: ""
          TF_VAR_aws_region: ""
          TF_VAR_backend_image: ""
          TF_VAR_cloudfront_certificate_arn: ""
          TF_VAR_cloudfront_distribution_arn: ""
          TF_VAR_cloudfront_oac_arn: ""
          TF_VAR_root_domain: ""
          TF_VAR_route53_zone_id: ""
          TF_VAR_runtime_role_arn: ""
        run: |
          python .github/scripts/terraform-plan-console.py "$RUNNER_TEMP/terraform-plan.json" \
            --environment '${{ inputs.environment }}'

      - name: Require exact-plan visibility while ownership enforcement is skipped
        shell: bash
        run: |
          if [[ "${PAWLOCAL_TERRAFORM_DIAGNOSTIC_LOGS:-}" != 'true' ]]; then
            echo 'Ownership enforcement may be skipped only when raw exact-plan diagnostics are enabled for reviewer inspection.' >&2
            exit 1
          fi

      - name: Print raw saved plan for diagnosis
        if: ${{ vars.PAWLOCAL_TERRAFORM_DIAGNOSTIC_LOGS == 'true' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_CONFIG_FILE: ""
          AWS_DEFAULT_REGION: ""
          AWS_REGION: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          COGNITO_DELEGATED_ROLE_ARN: ""
          COGNITO_DEPLOYMENT_PROFILE: ""
          COGNITO_TERRAFORM_PURPOSE: ""
          GRAFANA_AUTH: ""
          GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ""
          PAWLOCAL_AWS_ACCOUNT_ID: ""
          PAWLOCAL_TF_STATE_BUCKET: ""
          PLAN_PREFIX: ""
          PLAN_TRANSFER_BUCKET: ""
          TERRAFORM_ROLE_ARN: ""
          TF_STATE_KEY: ""
          TF_VAR_aws_region: ""
          TF_VAR_backend_image: ""
          TF_VAR_cloudfront_certificate_arn: ""
          TF_VAR_cloudfront_distribution_arn: ""
          TF_VAR_cloudfront_oac_arn: ""
          TF_VAR_root_domain: ""
          TF_VAR_route53_zone_id: ""
          TF_VAR_runtime_role_arn: ""
        run: |
          script --quiet --return \
            --command="terraform -chdir=\"$TF_ROOT\" show tfplan" /dev/null

      - name: Publish sanitized summary with ownership enforcement skipped for MVP
        shell: bash
        run: |
          release_flag=()
          if [[ '${{ inputs.phase }}' == 'release' ]]; then release_flag+=(--release-only); fi
          # Temporary accepted risk: remove --skip-enforcement when #148 restores the guard.
          python .github/scripts/terraform-environment-plan.py "$RUNNER_TEMP/terraform-plan.json" \
            --environment '${{ inputs.environment }}' --skip-enforcement \
            "${release_flag[@]}" >> "$GITHUB_STEP_SUMMARY"

      # Owner-directed temporary exception (#305 / DEC-015): the shared strict
      # release-plan invocation is commented out for ordinary and incident releases.
      # Differentiated plan policies are deferred to #308.
      # - name: Validate strict release plan guards
      #   if: inputs.phase == 'release'
      #   env:
      #     PYTHONPATH: ops/change-authorization:ops/incident-response
      #   run: python ops/change-authorization/guards.py --mode=validate-plan --plan-file="$RUNNER_TEMP/terraform-plan.json"

      - name: Bind exact plan metadata
        id: metadata
        shell: bash
        run: |
          digest="$(python .github/scripts/terraform-plan-metadata.py create "$TF_ROOT/tfplan" "$TF_ROOT/plan-metadata.json" \
            --environment '${{ inputs.environment }}' --state-key "$TF_STATE_KEY" --commit "$GITHUB_SHA" \
            --account-id "$PAWLOCAL_AWS_ACCOUNT_ID" --backend-bucket "$PAWLOCAL_TF_STATE_BUCKET" --backend-region "$AWS_REGION" \
            --repository-id "$GITHUB_REPOSITORY_ID" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT")"
          echo "plan_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "Exact saved-plan digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload opaque plan to the private transfer bucket
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-warn-script-location -r .github/scripts/requirements-terraform-plan-transfer.txt
          python .github/scripts/terraform-plan-transfer.py upload "$PLAN_TRANSFER_BUCKET" "$PLAN_PREFIX" "$TF_ROOT/tfplan" "$TF_ROOT/plan-metadata.json"

      - name: Remove delegated Cognito profile
        if: always()
        shell: bash
        run: bash .github/scripts/cleanup-cognito-terraform-profile.sh

  apply:
    name: Apply reviewed exact ${{ inputs.environment }} plan
    needs: [plan, reconcile-preflight]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}-apply
    permissions:
      contents: read
      id-token: write
    env:
      AWS_PARTITION: aws
      AWS_REGION: ${{ vars.AWS_REGION }}
      COGNITO_TERRAFORM_PURPOSE: apply
      PAWLOCAL_ENVIRONMENT: ${{ inputs.environment }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      PLAN_TRANSFER_BUCKET: ${{ fromJSON(needs.reconcile-preflight.outputs.configuration || '{}').PAWLOCAL_TERRAFORM_PLAN_BUCKET || vars.PAWLOCAL_TERRAFORM_PLAN_BUCKET }}
      TERRAFORM_ROLE_ARN: ${{ fromJSON(needs.reconcile-preflight.outputs.configuration || '{}').PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN || vars.PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN }}
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ fromJSON(needs.reconcile-preflight.outputs.configuration || '{}').PAWLOCAL_AWS_ACCOUNT_ID || vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      GRAFANA_AUTH: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
      GRAFANA_URL: ${{ needs.plan.outputs.grafana_url || (vars.PAWLOCAL_HOSTED_OBSERVABILITY_CONFIG != '' && vars.PAWLOCAL_HOSTED_OBSERVABILITY_CONFIG != 'null' && fromJSON(vars.PAWLOCAL_HOSTED_OBSERVABILITY_CONFIG).stack_url) || '' }}
    steps:
      - name: Check out the exact planned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact clean source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate the matching apply identity
        shell: bash
        run: |
          [[ "$TERRAFORM_ROLE_ARN" == "arn:aws:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/pawlocal-${{ inputs.environment }}-terraform-apply" ]]
          test -n "$PLAN_TRANSFER_BUCKET"

      - name: Configure bounded apply credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          allowed-account-ids: ${{ env.PAWLOCAL_AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: "true"

      - name: Configure and verify delegated Cognito apply profile
        shell: bash
        run: bash .github/scripts/configure-cognito-terraform-profile.sh

      - name: Prepare optional on-call delegated profile
        shell: bash
        run: bash .github/scripts/configure-oncall-terraform-profile.sh

      - name: Install pinned Aurora DSQL setup dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-warn-script-location \
            -r .github/scripts/requirements-dsql-post-apply.txt
          PYTHONPATH=backend python -c 'import aurora_dsql_psycopg.pool; import pawlocal.dsql_post_apply_setup'

      - name: Download the exact saved plan
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-warn-script-location -r .github/scripts/requirements-terraform-plan-transfer.txt
          python .github/scripts/terraform-plan-transfer.py download "$PLAN_TRANSFER_BUCKET" "$PLAN_PREFIX" "$RUNNER_TEMP/saved-plan" plan-metadata.json

      - name: Verify exact saved plan metadata and digest
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
        run: |
          actual="$(python .github/scripts/terraform-plan-metadata.py verify "$RUNNER_TEMP/saved-plan/tfplan" "$RUNNER_TEMP/saved-plan/plan-metadata.json" \
            --environment '${{ inputs.environment }}' --state-key "$TF_STATE_KEY" --commit "$GITHUB_SHA" \
            --account-id "$PAWLOCAL_AWS_ACCOUNT_ID" --backend-bucket "$PAWLOCAL_TF_STATE_BUCKET" --backend-region "$AWS_REGION" \
            --repository-id "$GITHUB_REPOSITORY_ID" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT")"
          test "$actual" = "$EXPECTED_SHA256"

      - name: Set up Terraform and initialize matching state
        uses: ./.github/actions/setup-terraform-toolchain
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialize matching state and apply only the reviewed plan
        shell: bash
        run: |
          if python .github/scripts/terraform-command-output.py --log "$RUNNER_TEMP/terraform-init.log" -- \
            terraform -chdir="$TF_ROOT" init -input=false -reconfigure -lockfile=readonly \
              -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" \
              -backend-config="key=${TF_STATE_KEY}" \
              -backend-config="region=${AWS_REGION}" \
              -backend-config='encrypt=true' \
              -backend-config='use_lockfile=true'; then
            :
          else
            status=$?
            echo 'Terraform initialization failed; see the operation output above.' >&2
            exit "$status"
          fi

          python -m pip install --disable-pip-version-check -r ops/configuration/requirements.txt
          terraform -chdir="$TF_ROOT" show -json "$RUNNER_TEMP/saved-plan/tfplan" > "$RUNNER_TEMP/parameter-create-check.json"
          python ops/configuration/check-collisions.py "$RUNNER_TEMP/parameter-create-check.json" --environment '${{ inputs.environment }}'
          python .github/scripts/verify-terraform-source-checkout.py
          apply_command=(terraform -chdir="$TF_ROOT" apply -input=false -lock-timeout=5m)
          if [[ "${PAWLOCAL_TERRAFORM_DIAGNOSTIC_LOGS:-}" != 'true' ]]; then
            apply_command+=(-no-color)
          fi
          apply_command+=("$RUNNER_TEMP/saved-plan/tfplan")
          if python .github/scripts/terraform-command-output.py --log "$RUNNER_TEMP/terraform-apply.log" -- \
            "${apply_command[@]}"; then
            :
          else
            status=$?
            echo 'Terraform apply failed; see the operation output above.' >&2
            exit "$status"
          fi
          echo 'The exact reviewed Terraform plan applied successfully. Runtime verification remains a separate required gate.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove delegated Cognito profile
        if: always()
        shell: bash
        run: bash .github/scripts/cleanup-cognito-terraform-profile.sh

  reconcile-after-apply:
    needs: apply
    if: ${{ !cancelled() && needs.apply.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reconcile-environment.yml
    with:
      environment: ${{ inputs.environment }}
      mode: ${{ inputs.phase == 'foundation' && 'audit' || 'enforce' }}
      fail_on_error: false
      caller_holds_lifecycle_lock: true
    secrets:
      PAWLOCAL_CONFIG_GITHUB_TOKEN: ${{ secrets.PAWLOCAL_CONFIG_GITHUB_TOKEN }}
