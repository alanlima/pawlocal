name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawlocal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected checks
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      backend: ${{ steps.paths.outputs.backend }}
      compose: ${{ steps.paths.outputs.compose }}
      terraform: ${{ steps.paths.outputs.terraform }}
      workflows: ${{ steps.paths.outputs.workflows }}
    steps:
      - name: Check out complete history for path comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python scripts/ci/classify_changed_paths.py --all >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head="$CURRENT_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            python scripts/ci/classify_changed_paths.py --all >> "$GITHUB_OUTPUT"
          else
            git diff --no-renames --name-only -z "$base" "$head" \
              | python scripts/ci/classify_changed_paths.py --nul >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_USE_MOCK_BACKEND: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format and lint
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser tests
        run: npm run test:e2e

  backend:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pawlocal
          POSTGRES_PASSWORD: pawlocal-ci-password
          POSTGRES_DB: pawlocal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pawlocal -d pawlocal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      PAWLOCAL_DATABASE_URL: postgresql+psycopg://pawlocal:pawlocal-ci-password@localhost:5432/pawlocal_test
      PAWLOCAL_TEST_DATABASE_URL: postgresql+psycopg://pawlocal:pawlocal-ci-password@localhost:5432/pawlocal_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Lint Python code
        run: ruff check .

      - name: Apply migrations to the disposable CI database
        run: alembic -c alembic.ini upgrade head

      - name: Run backend unit and PostgreSQL integration tests
        run: pytest

  compose:
    name: Compose validation and readiness smoke
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure local-only Compose environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build the full stack with its declared host-network entitlement
        run: |
          docker compose build --print > "${RUNNER_TEMP}/pawlocal-bake.json"
          docker buildx bake --allow network.host --file "${RUNNER_TEMP}/pawlocal-bake.json"

      - name: Start the full stack and wait for health checks
        run: docker compose up --detach --wait --wait-timeout 300

      - name: Smoke-check frontend, API, and Grafana
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5173/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /dev/null

      - name: Stop stack and remove CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  terraform:
    name: Terraform format and validation
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers without configuring the backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  workflow-validation:
    name: Workflow syntax, security, and path tests
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned actionlint release
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Lint workflow syntax and security
        run: actionlint -ignore 'unexpected key "queue"'

      - name: Verify path ownership and workflow trigger cases
        run: python -m unittest discover -s tests/ci -v

  required-status:
    name: Required CI status
    if: always()
    needs:
      - changes
      - frontend
      - backend
      - compose
      - terraform
      - workflow-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Accept successful checks and intentionally skipped components
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-validation.result }}
        run: |
          set -euo pipefail
          python scripts/ci/aggregate_results.py
