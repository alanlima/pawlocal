name: Terraform CI

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/scripts/terraform-environment-plan.py"
      - ".github/scripts/validate-hosted-observability.py"
      - "tests/ci/test_hosted_observability_config.py"
      - "tests/ci/test_monitoring_boundary.py"
      - "tests/ci/fixtures/aws-ssm-action-catalog.json"
      - ".github/scripts/terraform-plan-metadata.py"
      - ".github/scripts/terraform-production-lifecycle.py"
      - ".github/scripts/configure-cognito-terraform-profile.sh"
      - ".github/scripts/cleanup-cognito-terraform-profile.sh"
      - ".github/scripts/verify-terraform-source-checkout.py"
      - ".github/scripts/verify-cognito-provider-contract.py"
      - "tests/ci/test_cognito_lambda_module_saved_plan.py"
      - "tests/ci/test_monitoring_secret_lifecycle.py"
      - "tests/ci/incident_receiver.test.mjs"
      - ".github/workflows/terraform-ci.yml"
      - ".github/workflows/terraform-iam-bootstrap.yml"
      - ".github/scripts/bootstrap*.py"
      - ".github/scripts/requirements-iam-bootstrap.txt"
      - "ops/iam-bootstrap/**"
      - "tests/ci/test_iam_bootstrap*.py"
      - "tests/ci/test_bootstrap_identity*.py"
      - "tests/ci/check_configuration_reader_policy.py"
      - ".github/workflows/terraform-environment.yml"
      - ".github/workflows/terraform-environment-destroy.yml"
      - "tests/ci/test_dsql_setup_terraform_lifecycle.py"
      - "tests/ci/test_terraform_greenfield.py"
      - "tests/ci/test_terraform_production_lifecycle.py"
      - "tests/ci/test_cognito_terraform_workflow.py"
      - '!**/*.md'
      - '!**/*.mdx'
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/scripts/terraform-environment-plan.py"
      - ".github/scripts/validate-hosted-observability.py"
      - "tests/ci/test_hosted_observability_config.py"
      - "tests/ci/test_monitoring_boundary.py"
      - "tests/ci/fixtures/aws-ssm-action-catalog.json"
      - ".github/scripts/terraform-plan-metadata.py"
      - ".github/scripts/terraform-production-lifecycle.py"
      - ".github/scripts/configure-cognito-terraform-profile.sh"
      - ".github/scripts/cleanup-cognito-terraform-profile.sh"
      - ".github/scripts/verify-terraform-source-checkout.py"
      - ".github/scripts/verify-cognito-provider-contract.py"
      - "tests/ci/test_cognito_lambda_module_saved_plan.py"
      - "tests/ci/test_monitoring_secret_lifecycle.py"
      - "tests/ci/incident_receiver.test.mjs"
      - ".github/workflows/terraform-ci.yml"
      - ".github/workflows/terraform-iam-bootstrap.yml"
      - ".github/scripts/bootstrap*.py"
      - ".github/scripts/requirements-iam-bootstrap.txt"
      - "ops/iam-bootstrap/**"
      - "tests/ci/test_iam_bootstrap*.py"
      - "tests/ci/test_bootstrap_identity*.py"
      - "tests/ci/check_configuration_reader_policy.py"
      - ".github/workflows/terraform-environment.yml"
      - ".github/workflows/terraform-environment-destroy.yml"
      - "tests/ci/test_dsql_setup_terraform_lifecycle.py"
      - "tests/ci/test_terraform_greenfield.py"
      - "tests/ci/test_terraform_production_lifecycle.py"
      - "tests/ci/test_cognito_terraform_workflow.py"
      - '!**/*.md'
      - '!**/*.mdx'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pawlocal-terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validation (${{ matrix.root }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        root:
          - iam-bootstrap
          - environments/development
          - environments/production
          - modules/dsql-post-apply-setup
          - modules/pawlocal-environment
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Set up Node.js for Lambda handler tests
        if: matrix.root == 'modules/pawlocal-environment'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive .

      - name: Initialize locked bootstrap and environment providers without configuring the backend
        if: matrix.root == 'iam-bootstrap' || startsWith(matrix.root, 'environments/')
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Initialize reusable-module providers without configuring the backend
        if: ${{ matrix.root != 'iam-bootstrap' && !startsWith(matrix.root, 'environments/') }}
        run: terraform init -backend=false -input=false

      - name: Prove proposed SSM write-only lifecycle against loopback only
        if: matrix.root == 'iam-bootstrap'
        env:
          PAWLOCAL_RUN_SECRET_LIFECYCLE_FIXTURE: "1"
        run: python ../../../tests/ci/test_monitoring_secret_lifecycle.py -v

      - name: Validate Terraform configuration
        if: matrix.root != 'modules/pawlocal-environment'
        run: terraform validate -no-color

      # The reusable environment module requires an aliased provider supplied by
      # its caller. Both environment roots validate that provider wiring; the
      # module's Terraform tests below exercise it with explicit test providers.

      - name: Test rendered IAM policies
        if: matrix.root == 'iam-bootstrap' || matrix.root == 'modules/pawlocal-environment'
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_SESSION_TOKEN: test
          AWS_EC2_METADATA_DISABLED: true
        run: |
          terraform test -no-color
          if [ "${{ matrix.root }}" = "iam-bootstrap" ]; then
            # Capture one provider-compiled fixture for semantic policy evaluation;
            # keep the full suite's normal diagnostics above rather than verbose schemas.
            terraform test -filter=tests/configuration_reader.tftest.hcl -no-color -json -verbose > "$RUNNER_TEMP/reader-test.jsonl"
            python ../../../tests/ci/check_configuration_reader_policy.py "$RUNNER_TEMP/reader-test.jsonl"
          fi

      - name: Test Cognito pre sign-up trigger
        if: matrix.root == 'modules/pawlocal-environment'
        run: node --test lambda/cognito-pre-signup/index.test.mjs

      - name: Test pinned Lambda module across saved-plan runners
        if: matrix.root == 'modules/pawlocal-environment'
        env:
          PAWLOCAL_RUN_TERRAFORM_LAMBDA_MODULE_INTEGRATION: "1"
        run: python ../../../../tests/ci/test_cognito_lambda_module_saved_plan.py -v

      - name: Verify AWS provider Cognito log-group refresh contract
        if: matrix.root == 'modules/pawlocal-environment'
        run: python ../../../../.github/scripts/verify-cognito-provider-contract.py

      - name: Test DSQL setup lifecycle transitions
        if: matrix.root == 'modules/dsql-post-apply-setup'
        run: python ../../../../tests/ci/test_dsql_setup_terraform_lifecycle.py

      - name: Test signed Grafana incident receiver
        if: matrix.root == 'modules/pawlocal-environment'
        run: node --test ../../../../tests/ci/incident_receiver.test.mjs
