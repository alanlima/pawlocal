name: Terraform CI

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/scripts/terraform-environment-plan.py"
      - ".github/scripts/terraform-plan-metadata.py"
      - ".github/workflows/terraform-ci.yml"
      - ".github/workflows/terraform-environment.yml"
      - "tests/ci/test_terraform_greenfield.py"
      - '!**/*.md'
      - '!**/*.mdx'
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/scripts/terraform-environment-plan.py"
      - ".github/scripts/terraform-plan-metadata.py"
      - ".github/workflows/terraform-ci.yml"
      - ".github/workflows/terraform-environment.yml"
      - "tests/ci/test_terraform_greenfield.py"
      - '!**/*.md'
      - '!**/*.mdx'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pawlocal-terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validation (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - iam-bootstrap
          - environments/development
          - environments/production
          - modules/pawlocal-environment
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive .

      - name: Initialize providers without configuring the backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color
