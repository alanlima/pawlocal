name: Release · Promote verified release to production
run-name: 'Release · Promote verified release to production · ${{ github.ref_name }} · ${{ github.sha }}'

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full main-branch commit SHA already verified in development.
        required: true
        type: string
      backend_image:
        description: Exact development-verified immutable backend image reference.
        required: true
        type: string
      incident_environment:
        description: Optional incident origin; selects its on-call enforcement override. Empty means ordinary release.
        required: false
        default: ''
        type: string
      expected_workflow_sha:
        description: Optional exact workflow-source assertion; incident controller must bind this to release_commit. This is not authorization.
        required: false
        default: ''
        type: string

  workflow_call:
    inputs:
      release_commit:
        required: true
        type: string
      backend_image:
        required: true
        type: string
      incident_environment:
        required: false
        default: ''
        type: string
      expected_workflow_sha:
        required: false
        default: ''
        type: string
      rollback_from_deployment_id:
        required: true
        type: string
      rollback_to_deployment_id:
        required: true
        type: string
      rollback_reason:
        required: true
        type: string
    secrets:
      PAWLOCAL_CONFIG_GITHUB_TOKEN:
        required: true
      PAWLOCAL_CLOUDFRONT_CERTIFICATE_ARN:
        required: false
      GRAFANA_CLOUD_ACCESS_POLICY_TOKEN:
        required: false
      GRAFANA_SERVICE_ACCOUNT_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: pawlocal-lifecycle-production
  cancel-in-progress: false

jobs:
  incident-enforcement:
    name: Resolve incident release enforcement mode
    if: inputs.incident_environment != ''
    runs-on: ubuntu-24.04
    environment: oncall-${{ inputs.incident_environment == 'development' && 'development' || 'production' }}
    permissions:
      contents: read
    outputs:
      enforce_guards: ${{ steps.enforcement.outputs.enforce_guards }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve mode after entering origin on-call Environment
        id: enforcement
        env:
          INCIDENT_ENVIRONMENT: ${{ inputs.incident_environment }}
          PAWLOCAL_ONCALL_ENFORCE_GUARDS: ${{ vars.PAWLOCAL_ONCALL_ENFORCE_GUARDS || 'false' }}
        run: |
          case "$INCIDENT_ENVIRONMENT" in
            development|production) ;;
            *) echo 'Invalid incident Environment' >&2; exit 1 ;;
          esac
          python ops/incident-response/enforcement.py

  rollback-binding:
    name: Revalidate rollback selection under production lifecycle lock
    if: inputs.rollback_from_deployment_id != '' || inputs.rollback_to_deployment_id != '' || inputs.rollback_reason != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject stale or changed rollback target before deployment authority
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_FROM: ${{ inputs.rollback_from_deployment_id }}
          ROLLBACK_TO: ${{ inputs.rollback_to_deployment_id }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
        run: python ops/rollback-production.py validate

  workflow-binding:
    name: Verify production workflow source binding
    needs: [incident-enforcement, rollback-binding]
    if: always() && (needs.rollback-binding.result == 'success' || needs.rollback-binding.result == 'skipped') && (needs.incident-enforcement.result == 'success' || needs.incident-enforcement.result == 'skipped')
    outputs:
      enforce_guards: ${{ needs.incident-enforcement.outputs.enforce_guards || 'true' }}
    env:
      PAWLOCAL_ONCALL_ENFORCE_GUARDS: ${{ needs.incident-enforcement.outputs.enforce_guards || 'true' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Reject a changed dispatch source before deployment authority
        env:
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          ACTUAL_WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PAWLOCAL_ONCALL_ENFORCE_GUARDS" != true && "$PAWLOCAL_ONCALL_ENFORCE_GUARDS" != false ]]; then
            echo 'PAWLOCAL_ONCALL_ENFORCE_GUARDS must be true or false' >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_WORKFLOW_SHA" && "$PAWLOCAL_ONCALL_ENFORCE_GUARDS" == false ]]; then
            echo '[incident-enforcement] disabled: production workflow source binding policy'
          elif [[ -n "$EXPECTED_WORKFLOW_SHA" ]]; then
            [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$ACTUAL_WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
            test "$RELEASE_COMMIT" = "$EXPECTED_WORKFLOW_SHA"
          fi

  terraform-production:
    name: Apply exact production release plan
    needs: workflow-binding
    if: ${{ !cancelled() && needs.workflow-binding.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
    uses: ./.github/workflows/terraform-environment.yml
    with:
      environment: production
      phase: release
      backend_image: ${{ inputs.backend_image }}
      release_commit: ${{ inputs.release_commit }}
      release_only: true
      rollback_only: ${{ inputs.rollback_from_deployment_id != '' }}
      enforce_guards: ${{ needs.workflow-binding.outputs.enforce_guards }}
    secrets:
      PAWLOCAL_CONFIG_GITHUB_TOKEN: ${{ secrets.PAWLOCAL_CONFIG_GITHUB_TOKEN }}
      PAWLOCAL_CLOUDFRONT_CERTIFICATE_ARN: ${{ secrets.PAWLOCAL_CLOUDFRONT_CERTIFICATE_ARN }}
      GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}

  verify-production:
    name: Publish frontend and verify production
    needs: [workflow-binding, terraform-production]
    if: ${{ !cancelled() && needs.workflow-binding.result == 'success' && needs.terraform-production.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      deployments: write
      id-token: write
    env:
      PAWLOCAL_ONCALL_ENFORCE_GUARDS: ${{ needs.workflow-binding.outputs.enforce_guards }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_DEPLOY_ADAPTER_PATH: ${{ vars.PAWLOCAL_DEPLOY_ADAPTER_PATH }}
      PAWLOCAL_DATABASE_PROVIDER: aurora_dsql
      BACKEND_IMAGE: ${{ inputs.backend_image }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
    steps:
      - name: Check out selected verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - name: Validate selected release checkout
        shell: bash
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          [[ "$BACKEND_IMAGE" =~ ^ghcr\.io/alanlima/pawlocal-api@sha256:[0-9a-f]{64}$ ]]
      - name: Check out current configuration tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .configuration-tools
          persist-credentials: false
      - name: Load same-run reconciled public configuration
        env:
          RECONCILED_FRONTEND_CONFIG: ${{ needs.terraform-production.outputs.frontend_config }}
        run: python .configuration-tools/ops/configuration/build-config.py
      - name: Validate production promotion authorization guards
        env:
          PYTHONPATH: .configuration-tools/ops/change-authorization:.configuration-tools/ops/incident-response
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
        run: python .configuration-tools/ops/change-authorization/guards.py --mode=validate-promotion
      - name: Configure narrow production publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.PAWLOCAL_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: "true"
      - uses: ./.configuration-tools/.github/actions/setup-frontend-toolchain
      - name: Set frontend artifact build timestamp
        run: echo "VITE_APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_RELEASE_ENV: production
          VITE_USE_MOCK_BACKEND: "false"
          VITE_APP_COMMIT: ${{ inputs.release_commit }}
        run: npm run build
      - name: Create production release manifest and frontend archive
        shell: bash
        run: |
          mkdir -p release
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf release/frontend-production.tar.gz -C frontend/dist .
          python -m pip install --quiet 'alembic>=1.13,<2'
          python - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config('backend/alembic.ini')).get_heads()
          if len(heads) != 1:
              raise SystemExit('Expected exactly one PostgreSQL migration head')
          tree = ast.parse(Path('backend/pawlocal/dsql_migrations.py').read_text(encoding='utf-8'))
          dsql_revision = next(
              ast.literal_eval(statement.value)
              for statement in tree.body
              if isinstance(statement, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == 'BASELINE_REVISION' for target in statement.targets)
          )
          archive = Path('release/frontend-production.tar.gz')
          image = os.environ['BACKEND_IMAGE']
          value = {
              'schema_version': 3,
              'commit': os.environ['RELEASE_COMMIT'],
              'backend_image': image,
              'backend_image_digest': image.split('@', 1)[1],
              'migration_chains': {
                  'postgresql': {'runner': 'alembic', 'migration_id': heads[0]},
                  'aurora_dsql': {'runner': 'dsql_baseline', 'migration_id': dsql_revision},
              },
              'telemetry_enabled': os.environ['PAWLOCAL_TELEMETRY_ENABLED'] == 'true',
              'frontend_telemetry_enabled': os.environ['VITE_TELEMETRY_ENABLED'] == 'true',
              'frontend': {
                  'environment': 'production',
                  'artifact_digest': 'sha256:' + hashlib.sha256(archive.read_bytes()).hexdigest(),
              },
          }
          Path('release/release-manifest.json').write_text(json.dumps(value, separators=(',', ':')), encoding='utf-8')
          PY
          python .configuration-tools/ops/validate-release-metadata.py --manifest release/release-manifest.json
      - name: Publish exact production artifacts
        env:
          RELEASE_MANIFEST: release/release-manifest.json
          FRONTEND_ARCHIVE: release/frontend-production.tar.gz
        run: |
          cd .configuration-tools
          bash ops/run-deployment-adapter.sh deploy --environment production --manifest "$GITHUB_WORKSPACE/$RELEASE_MANIFEST" --frontend-archive "$GITHUB_WORKSPACE/$FRONTEND_ARCHIVE"
      - name: Verify production release
        env:
          RELEASE_MANIFEST: release/release-manifest.json
          EVIDENCE_FILE: release/production-verification.json
        run: |
          cd .configuration-tools
          bash ops/run-deployment-adapter.sh verify --environment production --manifest "$GITHUB_WORKSPACE/$RELEASE_MANIFEST" --evidence "$GITHUB_WORKSPACE/$EVIDENCE_FILE"
      - name: Install browser for served authentication verification
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify served OAuth configuration
        env:
          SERVED_RELEASE_ENV: production
          SERVED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          RECONCILED_FRONTEND_CONFIG: ${{ needs.terraform-production.outputs.frontend_config }}
        run: node .configuration-tools/ops/configuration/verify-served-auth.mjs
      - name: Record successful production deployment
        uses: actions/github-script@v9
        env:
          ENVIRONMENT_URL: ${{ env.PAWLOCAL_PUBLIC_BASE_URL }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ROLLBACK_FROM: ${{ inputs.rollback_from_deployment_id }}
          ROLLBACK_TO: ${{ inputs.rollback_to_deployment_id }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
        with:
          script: |
            const fs = require('fs')
            const crypto = require('crypto')
            const manifestBytes = fs.readFileSync('release/release-manifest.json')
            const evidenceBytes = fs.readFileSync('release/production-verification.json')
            const manifest = JSON.parse(manifestBytes.toString('utf8'))
            const evidence = JSON.parse(evidenceBytes.toString('utf8'))
            const sha256 = value => `sha256:${crypto.createHash('sha256').update(value).digest('hex')}`
            const deployment = await github.rest.repos.createDeployment({
              ...context.repo, ref: process.env.RELEASE_COMMIT, environment: 'production',
              production_environment: true, auto_merge: false, required_contexts: [],
              payload: {
                ...(process.env.ROLLBACK_FROM ? {
                  operation: 'rollback',
                  rollback_from_deployment_id: Number(process.env.ROLLBACK_FROM),
                  rollback_to_deployment_id: Number(process.env.ROLLBACK_TO),
                  rollback_reason: process.env.ROLLBACK_REASON,
                } : {}),
                record_schema_version: 1,
                manifest_schema_version: manifest.schema_version,
                evidence_schema_version: evidence.schema_version,
                evidence_validated: true,
                workflow_run_id: context.runId,
                workflow_run_attempt: Number(process.env.RUN_ATTEMPT),
                release_commit: manifest.commit,
                release_manifest_digest: sha256(manifestBytes),
                verification_evidence_digest: sha256(evidenceBytes),
                backend_image: process.env.BACKEND_IMAGE,
                backend_image_digest: evidence.backend_image_digest,
                running_image_digest: evidence.running_image_digest,
                frontend_artifact_digest: evidence.frontend_artifact_digest,
                database_provider: evidence.database_provider,
                migration_runner: evidence.migration_runner,
                migration_id: evidence.migration_id,
                telemetry_enabled: evidence.telemetry_enabled,
                frontend_telemetry_enabled: evidence.frontend_telemetry_enabled,
                public_endpoint_health: evidence.public_endpoint_health,
                database_query_smoke: evidence.database_query_smoke,
              },
            })
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: deployment.data.id, state: 'success',
              environment: 'production', environment_url: process.env.ENVIRONMENT_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Production release and public verification passed',
            })
            if (process.env.ROLLBACK_FROM) {
              await core.summary.addHeading('Production rollback verified')
                .addTable([
                  ['From deployment', process.env.ROLLBACK_FROM],
                  ['Restored deployment', process.env.ROLLBACK_TO],
                  ['New deployment', String(deployment.data.id)],
                  ['Restored commit', manifest.commit],
                  ['Backend image', process.env.BACKEND_IMAGE],
                ]).addRaw('Reason: ').addCodeBlock(process.env.ROLLBACK_REASON.replaceAll('`', '\\u0060')).write()
            }
