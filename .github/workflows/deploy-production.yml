name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Main-branch commit successfully deployed and verified in development
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pawlocal-production-deploy
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate development-verified release
    if: github.ref == 'refs/heads/main' && vars.PAWLOCAL_DEPLOY_MODE == 'codebuild'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      release_run_id: ${{ steps.validate.outputs.release_run_id }}
      manifest_digest: ${{ steps.validate.outputs.manifest_digest }}
      database_provider: ${{ steps.validate.outputs.database_provider }}
      migration_runner: ${{ steps.validate.outputs.migration_runner }}
      migration_id: ${{ steps.validate.outputs.migration_id }}
    steps:
      - name: Check out main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate selected commit, CI run and development deployment
        id: validate
        uses: actions/github-script@v7
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        with:
          script: |
            const commit = process.env.RELEASE_COMMIT.toLowerCase()
            if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error('Enter a complete 40-character commit SHA')
            const { execFileSync } = require('child_process')
            execFileSync('git', ['fetch', '--no-tags', 'origin', 'main'], { stdio: 'inherit' })
            try {
              execFileSync('git', ['merge-base', '--is-ancestor', commit, 'origin/main'], { stdio: 'ignore' })
            } catch {
              throw new Error('Selected commit is not in main history')
            }

            const workflow = await github.rest.actions.getWorkflow({ ...context.repo, workflow_id: 'fullstack-release.yml' })
            let run
            for (let page = 1; page <= 20 && !run; page++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: workflow.data.id,
                branch: 'main',
                status: 'success',
                per_page: 100,
                page,
              })
              if (runs.data.workflow_runs.length === 0) break
              run = runs.data.workflow_runs.find(item => item.head_sha === commit && item.event === 'push' && item.head_branch === 'main')
            }
            if (!run) throw new Error('No successful full-stack release workflow exists for this commit')

            const deployments = await github.rest.repos.listDeployments({
              ...context.repo,
              ref: commit,
              environment: 'development',
              per_page: 100,
            })
            let verified
            let verifiedSelection
            for (const deployment of deployments.data) {
              if (Number(deployment.payload?.workflow_run_id) !== run.id) continue
              const statuses = await github.rest.repos.listDeploymentStatuses({
                ...context.repo,
                deployment_id: deployment.id,
                per_page: 100,
              })
              const latestStatus = statuses.data.reduce((latest, status) =>
                !latest || Date.parse(status.created_at) > Date.parse(latest.created_at) ? status : latest, null)
              if (!latestStatus || latestStatus.state !== 'success') continue
              let successPayload
              try {
                successPayload = typeof latestStatus.payload === 'string'
                  ? JSON.parse(latestStatus.payload)
                  : (latestStatus.payload || {})
              } catch {
                continue
              }
              const provider = successPayload.database_provider
              const selectedChain = deployment.payload?.migration_chains?.[provider]
              if (successPayload.telemetry_enabled === false &&
                  ['postgresql', 'aurora_dsql'].includes(provider) &&
                  selectedChain && successPayload.migration_runner === selectedChain.runner &&
                  successPayload.migration_id === selectedChain.migration_id &&
                  /^sha256:[0-9a-f]{64}$/.test(successPayload.backend_image_digest || '') &&
                  /^sha256:[0-9a-f]{64}$/.test(deployment.payload?.backend_image_digest || '') &&
                  successPayload.backend_image_digest === deployment.payload.backend_image_digest &&
                  /^sha256:[0-9a-f]{64}$/.test(deployment.payload?.release_manifest_digest || '')) {
                verified = deployment
                verifiedSelection = successPayload
                break
              }
            }
            if (!verified) throw new Error('No successful development deployment record matches this release run and backend digest')
            core.setOutput('release_run_id', run.id)
            core.setOutput('manifest_digest', verified.payload.release_manifest_digest)
            core.setOutput('database_provider', verifiedSelection.database_provider)
            core.setOutput('migration_runner', verifiedSelection.migration_runner)
            core.setOutput('migration_id', verifiedSelection.migration_id)
            core.info(`Validated ${commit}, workflow run ${run.id}, development deployment ${verified.id}`)

  deploy-production:
    name: Promote verified release to production
    needs: validate-release
    runs-on: codebuild-pawlocal-deploy-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: production
    env:
      PAWLOCAL_DEPLOY_ADAPTER_PATH: ${{ vars.PAWLOCAL_DEPLOY_ADAPTER_PATH }}
      PAWLOCAL_DEPLOY_ROLE_ARN: ${{ vars.PAWLOCAL_DEPLOY_ROLE_ARN }}
      PAWLOCAL_DATABASE_PROVIDER: aurora_dsql
      PAWLOCAL_EXPECTED_DATABASE_PROVIDER: ${{ needs.validate-release.outputs.database_provider }}
      PAWLOCAL_EXPECTED_MIGRATION_RUNNER: ${{ needs.validate-release.outputs.migration_runner }}
      PAWLOCAL_EXPECTED_MIGRATION_ID: ${{ needs.validate-release.outputs.migration_id }}
      PAWLOCAL_TELEMETRY_ENABLED: "false"
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_DEPLOY_HOST: ${{ vars.PAWLOCAL_DEPLOY_HOST }}
      PAWLOCAL_DEPLOY_KNOWN_HOSTS: ${{ vars.PAWLOCAL_DEPLOY_KNOWN_HOSTS }}
      PAWLOCAL_FRONTEND_BUCKET: ${{ vars.PAWLOCAL_FRONTEND_BUCKET }}
      PAWLOCAL_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.PAWLOCAL_CLOUDFRONT_DISTRIBUTION_ID }}
      PAWLOCAL_DSQL_ENDPOINT: ${{ vars.PAWLOCAL_DSQL_ENDPOINT }}
      PAWLOCAL_DSQL_DATABASE_ROLE: ${{ vars.PAWLOCAL_DSQL_DATABASE_ROLE }}
      PAWLOCAL_COGNITO_ISSUER: ${{ vars.PAWLOCAL_COGNITO_ISSUER }}
      PAWLOCAL_COGNITO_APP_CLIENT_ID: ${{ vars.PAWLOCAL_COGNITO_APP_CLIENT_ID }}
      PAWLOCAL_PUBLIC_BASE_URL: ${{ vars.PAWLOCAL_PUBLIC_BASE_URL }}
      PAWLOCAL_API_HEALTH_URL: ${{ vars.PAWLOCAL_API_HEALTH_URL }}
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      packages: read
    steps:
      - name: Check out selected release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}

      - name: Download development-verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pawlocal-release-manifest
          path: release/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-release.outputs.release_run_id }}

      - name: Verify release artifact identity
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          EXPECTED_MANIFEST_DIGEST: ${{ needs.validate-release.outputs.manifest_digest }}
        run: |
          actual_digest="sha256:$(sha256sum release/release-manifest.json | cut -d ' ' -f 1)"
          test "$actual_digest" = "$EXPECTED_MANIFEST_DIGEST"
          python ops/validate-release-metadata.py --manifest release/release-manifest.json
          jq -e --arg commit "$RELEASE_COMMIT" '.commit == $commit' release/release-manifest.json > /dev/null
          test "$PAWLOCAL_DATABASE_PROVIDER" = "$PAWLOCAL_EXPECTED_DATABASE_PROVIDER"

      - name: Require the environment-specific OIDC role
        run: test -n "$PAWLOCAL_DEPLOY_ROLE_ARN"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PAWLOCAL_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: PawLocalProd-${{ github.run_id }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build production frontend from the verified commit
        working-directory: frontend
        env:
          VITE_RELEASE_ENV: production
          VITE_USE_MOCK_BACKEND: "false"
          VITE_TELEMETRY_ENABLED: "false"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI }}
          VITE_COGNITO_LOGOUT_URI: ${{ vars.VITE_COGNITO_LOGOUT_URI }}
          VITE_COGNITO_SCOPES: ${{ vars.VITE_COGNITO_SCOPES }}
          VITE_APP_COMMIT: ${{ inputs.release_commit }}
        run: |
          test -n "$VITE_API_BASE_URL"
          npm ci
          npm run build

      - name: Package production frontend and verify backend digest
        id: release
        run: |
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf release/frontend-production.tar.gz -C frontend/dist .
          frontend_digest="sha256:$(sha256sum release/frontend-production.tar.gz | cut -d ' ' -f 1)"
          backend_image="$(jq -r .backend_image release/release-manifest.json)"
          echo "$backend_image" | grep -Eq '@sha256:[0-9a-f]{64}$'
          echo "frontend_digest=$frontend_digest" >> "$GITHUB_OUTPUT"
          jq --arg frontend_digest "$frontend_digest" \
            '. + {frontend:{environment:"production",artifact_digest:$frontend_digest,source_development_artifact_digest:.frontend.artifact_digest}}' \
            release/release-manifest.json > release/production-release-manifest.json
          production_manifest_digest="sha256:$(sha256sum release/production-release-manifest.json | cut -d ' ' -f 1)"
          echo "production_manifest_digest=$production_manifest_digest" >> "$GITHUB_OUTPUT"

      - name: Create production deployment record
        id: deployment
        uses: actions/github-script@v7
        env:
          SOURCE_MANIFEST_DIGEST: ${{ needs.validate-release.outputs.manifest_digest }}
          PRODUCTION_MANIFEST_DIGEST: ${{ steps.release.outputs.production_manifest_digest }}
          FRONTEND_DIGEST: ${{ steps.release.outputs.frontend_digest }}
          SOURCE_RUN_ID: ${{ needs.validate-release.outputs.release_run_id }}
        with:
          script: |
            const fs = require('fs')
            const value = JSON.parse(fs.readFileSync('release/production-release-manifest.json', 'utf8'))
            const deployment = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: value.commit,
              environment: 'production',
              production_environment: true,
              auto_merge: false,
              required_contexts: [],
              payload: {
                workflow_run_id: context.runId,
                source_release_run_id: Number(process.env.SOURCE_RUN_ID),
                backend_image: value.backend_image,
                backend_image_digest: value.backend_image_digest,
                development_frontend_digest: value.frontend.source_development_artifact_digest,
                production_frontend_digest: process.env.FRONTEND_DIGEST,
                source_release_manifest_digest: process.env.SOURCE_MANIFEST_DIGEST,
                production_release_manifest_digest: process.env.PRODUCTION_MANIFEST_DIGEST,
                migration_chains: value.migration_chains,
                telemetry_enabled: false,
              },
            })
            core.setOutput('deployment_id', deployment.data.id)
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              environment: 'production',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Production promotion started',
            })

      - name: Deploy exact backend digest and production frontend through the environment adapter
        env:
          RELEASE_MANIFEST: release/production-release-manifest.json
          FRONTEND_ARCHIVE: release/frontend-production.tar.gz
          PAWLOCAL_PUBLIC_BASE_URL: ${{ vars.PAWLOCAL_PUBLIC_BASE_URL }}
          PAWLOCAL_API_HEALTH_URL: ${{ vars.PAWLOCAL_API_HEALTH_URL }}
          PAWLOCAL_DATABASE_PROVIDER: aurora_dsql
          PAWLOCAL_EXPECTED_DATABASE_PROVIDER: ${{ needs.validate-release.outputs.database_provider }}
          PAWLOCAL_EXPECTED_MIGRATION_RUNNER: ${{ needs.validate-release.outputs.migration_runner }}
          PAWLOCAL_EXPECTED_MIGRATION_ID: ${{ needs.validate-release.outputs.migration_id }}
          PAWLOCAL_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PAWLOCAL_DEPLOY_SSH_PRIVATE_KEY }}
          PAWLOCAL_DSQL_ACCESS_KEY_ID: ${{ secrets.PAWLOCAL_DSQL_ACCESS_KEY_ID }}
          PAWLOCAL_DSQL_SECRET_ACCESS_KEY: ${{ secrets.PAWLOCAL_DSQL_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash ops/run-deployment-adapter.sh deploy --environment production --manifest "$RELEASE_MANIFEST" --frontend-archive "$FRONTEND_ARCHIVE"

      - name: Verify production release through the environment adapter
        env:
          RELEASE_MANIFEST: release/production-release-manifest.json
          EVIDENCE_FILE: release/production-verification.json
          PAWLOCAL_PUBLIC_BASE_URL: ${{ vars.PAWLOCAL_PUBLIC_BASE_URL }}
          PAWLOCAL_API_HEALTH_URL: ${{ vars.PAWLOCAL_API_HEALTH_URL }}
          PAWLOCAL_DATABASE_PROVIDER: aurora_dsql
          PAWLOCAL_EXPECTED_DATABASE_PROVIDER: ${{ needs.validate-release.outputs.database_provider }}
          PAWLOCAL_EXPECTED_MIGRATION_RUNNER: ${{ needs.validate-release.outputs.migration_runner }}
          PAWLOCAL_EXPECTED_MIGRATION_ID: ${{ needs.validate-release.outputs.migration_id }}
          PAWLOCAL_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PAWLOCAL_DEPLOY_SSH_PRIVATE_KEY }}
        run: bash ops/run-deployment-adapter.sh verify --environment production --manifest "$RELEASE_MANIFEST" --evidence "$EVIDENCE_FILE"

      - name: Validate production deployment evidence and selected migration chain
        env:
          PAWLOCAL_EXPECTED_DATABASE_PROVIDER: ${{ needs.validate-release.outputs.database_provider }}
          PAWLOCAL_EXPECTED_MIGRATION_RUNNER: ${{ needs.validate-release.outputs.migration_runner }}
          PAWLOCAL_EXPECTED_MIGRATION_ID: ${{ needs.validate-release.outputs.migration_id }}
        run: |
          python ops/validate-release-metadata.py \
            --manifest release/production-release-manifest.json \
            --evidence release/production-verification.json \
            --environment production \
            --database-provider "$PAWLOCAL_EXPECTED_DATABASE_PROVIDER" \
            --migration-runner "$PAWLOCAL_EXPECTED_MIGRATION_RUNNER" \
            --migration-id "$PAWLOCAL_EXPECTED_MIGRATION_ID"

      - name: Upload production deployment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pawlocal-production-deployment
          path: |
            release/release-manifest.json
            release/production-release-manifest.json
            release/frontend-production.tar.gz
            release/production-verification.json
          if-no-files-found: error
          retention-days: 90

      - name: Mark production deployment successful
        if: success()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          PAWLOCAL_PUBLIC_BASE_URL: ${{ vars.PAWLOCAL_PUBLIC_BASE_URL }}
        with:
          script: |
            const fs = require('fs')
            const evidence = JSON.parse(fs.readFileSync('release/production-verification.json', 'utf8'))
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'success',
              environment: 'production',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Production health, release verification, and evidence upload passed',
              environment_url: process.env.PAWLOCAL_PUBLIC_BASE_URL,
              payload: JSON.stringify({
                database_provider: evidence.database_provider,
                migration_runner: evidence.migration_runner,
                migration_id: evidence.migration_id,
                backend_image_digest: evidence.backend_image_digest,
                telemetry_enabled: evidence.telemetry_enabled,
              }),
            })

      - name: Mark production deployment failed
        if: ${{ (failure() || cancelled()) && steps.deployment.outputs.deployment_id != '' }}
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'failure',
              environment: 'production',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Production deployment, verification, or evidence finalization failed',
            })
