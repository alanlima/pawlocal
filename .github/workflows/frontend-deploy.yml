name: Frontend pull request checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "openapi.yaml"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - ".github/workflows/frontend-deploy.yml"
      - ".github/workflows/frontend-production-deploy.yml"
      - '!**/*.md'
      - '!**/*.mdx'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pawlocal-frontend-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_USE_MOCK_BACKEND: "true"
      VITE_APP_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format and lint
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Set frontend build timestamp
        run: echo "VITE_APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build mock-backed frontend
        run: npm run build
