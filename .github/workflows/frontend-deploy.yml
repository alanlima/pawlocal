name: Quality · Validate frontend

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ format('pawlocal-frontend-{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_RELEASE_ENV: development
      VITE_USE_MOCK_BACKEND: "false"
      VITE_TELEMETRY_ENABLED: "false"
      VITE_API_BASE_URL: https://api-dev.example.invalid/api/v1
      VITE_COGNITO_DOMAIN: https://auth.example.invalid
      VITE_COGNITO_CLIENT_ID: ci-public-client
      VITE_COGNITO_REDIRECT_URI: https://pawlocal-dev.example.invalid/auth/callback
      VITE_COGNITO_LOGOUT_URI: https://pawlocal-dev.example.invalid/
      VITE_APP_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: ./.github/actions/setup-frontend-toolchain

      - name: Format and lint
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Set frontend build timestamp
        run: echo "VITE_APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build HTTP-mode frontend
        run: npm run build
