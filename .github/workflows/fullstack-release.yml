name: Release · Publish and verify development
run-name: 'Release · Publish and verify development · ${{ github.ref_name }} · ${{ github.sha }}'

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "poetry.lock"
      - "uv.lock"
      - ".github/workflows/frontend-deploy.yml"
      - ".github/workflows/backend-ci.yml"
      - ".github/actions/setup-frontend-toolchain/**"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/release-rollback-production.yml"
      - ".github/workflows/frontend-production-deploy.yml"
      - "openapi.yaml"
      - "pyproject.toml"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/fullstack-release.yml"
      - ".github/workflows/terraform-environment.yml"
      - "ops/**"
      - "!**/*.md"
      - "!**/*.mdx"
      - "docs/oncall-setup.md"
      - "docs/oncall-troubleshooting.md"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "poetry.lock"
      - "uv.lock"
      - ".github/workflows/frontend-deploy.yml"
      - ".github/workflows/backend-ci.yml"
      - ".github/actions/setup-frontend-toolchain/**"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/release-rollback-production.yml"
      - ".github/workflows/frontend-production-deploy.yml"
      - "openapi.yaml"
      - "pyproject.toml"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/fullstack-release.yml"
      - ".github/workflows/terraform-environment.yml"
      - "ops/**"
      - "!**/*.md"
      - "!**/*.mdx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pawlocal-fullstack-pr-{0}', github.event.pull_request.number) || 'pawlocal-lifecycle-development' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks and HTTP-mode build
    uses: ./.github/workflows/frontend-deploy.yml

  backend:
    name: Backend checks
    uses: ./.github/workflows/backend-ci.yml

  publish:
    name: Publish immutable backend image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.reference.outputs.backend_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pawlocal-api:release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pawlocal-api
          cache-to: type=gha,mode=max,scope=pawlocal-api
      - name: Bind immutable image reference
        id: reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "backend_image=ghcr.io/${OWNER,,}/pawlocal-api@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

  terraform-development:
    name: Apply exact development release plan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: publish
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
    uses: ./.github/workflows/terraform-environment.yml
    with:
      environment: development
      phase: release
      backend_image: ${{ needs.publish.outputs.backend_image }}
      release_commit: ${{ github.sha }}
      release_only: true
    secrets:
      PAWLOCAL_CONFIG_GITHUB_TOKEN: ${{ secrets.PAWLOCAL_CONFIG_GITHUB_TOKEN }}
      PAWLOCAL_CLOUDFRONT_CERTIFICATE_ARN: ${{ secrets.PAWLOCAL_CLOUDFRONT_CERTIFICATE_ARN }}
      GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}

  verify-development:
    name: Publish frontend and verify development
    needs: [publish, terraform-development]
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      deployments: write
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_DEPLOY_ADAPTER_PATH: ${{ vars.PAWLOCAL_DEPLOY_ADAPTER_PATH }}
      PAWLOCAL_DATABASE_PROVIDER: aurora_dsql
      BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load same-run reconciled public configuration
        env:
          RECONCILED_FRONTEND_CONFIG: ${{ needs.terraform-development.outputs.frontend_config }}
        run: python ops/configuration/build-config.py
      - name: Configure narrow frontend publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.PAWLOCAL_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: "true"
      - uses: ./.github/actions/setup-frontend-toolchain
      - name: Build development frontend
        working-directory: frontend
        env:
          VITE_RELEASE_ENV: development
          VITE_USE_MOCK_BACKEND: "false"
          VITE_APP_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Create release manifest and frontend archive
        shell: bash
        run: |
          mkdir -p release
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf release/frontend-development.tar.gz -C frontend/dist .
          python -m pip install --quiet 'alembic>=1.13,<2'
          python - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config('backend/alembic.ini')).get_heads()
          if len(heads) != 1:
              raise SystemExit('Expected exactly one PostgreSQL migration head')
          tree = ast.parse(Path('backend/pawlocal/dsql_migrations.py').read_text(encoding='utf-8'))
          dsql_revision = next(
              ast.literal_eval(statement.value)
              for statement in tree.body
              if isinstance(statement, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == 'BASELINE_REVISION' for target in statement.targets)
          )
          archive = Path('release/frontend-development.tar.gz')
          image = os.environ['BACKEND_IMAGE']
          value = {
              'schema_version': 3,
              'commit': os.environ['GITHUB_SHA'],
              'backend_image': image,
              'backend_image_digest': image.split('@', 1)[1],
              'migration_chains': {
                  'postgresql': {'runner': 'alembic', 'migration_id': heads[0]},
                  'aurora_dsql': {'runner': 'dsql_baseline', 'migration_id': dsql_revision},
              },
              'telemetry_enabled': os.environ['PAWLOCAL_TELEMETRY_ENABLED'] == 'true',
              'frontend_telemetry_enabled': os.environ['VITE_TELEMETRY_ENABLED'] == 'true',
              'frontend': {
                  'environment': 'development',
                  'artifact_digest': 'sha256:' + hashlib.sha256(archive.read_bytes()).hexdigest(),
              },
          }
          Path('release/release-manifest.json').write_text(json.dumps(value, separators=(',', ':')), encoding='utf-8')
          PY
          python ops/validate-release-metadata.py --manifest release/release-manifest.json
      - name: Publish application artifacts through the environment adapter
        env:
          RELEASE_MANIFEST: release/release-manifest.json
          FRONTEND_ARCHIVE: release/frontend-development.tar.gz
        run: bash ops/run-deployment-adapter.sh deploy --environment development --manifest "$RELEASE_MANIFEST" --frontend-archive "$FRONTEND_ARCHIVE"
      - name: Verify the deployed release
        env:
          RELEASE_MANIFEST: release/release-manifest.json
          EVIDENCE_FILE: release/development-verification.json
        run: bash ops/run-deployment-adapter.sh verify --environment development --manifest "$RELEASE_MANIFEST" --evidence "$EVIDENCE_FILE"
      - name: Install browser for served authentication verification
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify served OAuth configuration
        env:
          SERVED_RELEASE_ENV: development
          SERVED_RELEASE_COMMIT: ${{ github.sha }}
          RECONCILED_FRONTEND_CONFIG: ${{ needs.terraform-development.outputs.frontend_config }}
        run: node ops/configuration/verify-served-auth.mjs
      - name: Validate development verification evidence
        run: python ops/validate-release-metadata.py --manifest release/release-manifest.json --evidence release/development-verification.json --environment development --database-provider aurora_dsql --migration-runner dsql_baseline --migration-id dsql_0001_initial
      - name: Record successful verified development deployment
        uses: actions/github-script@v9
        env:
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}
          ENVIRONMENT_URL: ${{ env.PAWLOCAL_PUBLIC_BASE_URL }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const crypto = require('crypto')
            const fs = require('fs')
            const manifestBytes = fs.readFileSync('release/release-manifest.json')
            const evidenceBytes = fs.readFileSync('release/development-verification.json')
            const manifest = JSON.parse(manifestBytes.toString('utf8'))
            const evidence = JSON.parse(evidenceBytes.toString('utf8'))
            const sha256 = value => `sha256:${crypto.createHash('sha256').update(value).digest('hex')}`
            const deployment = await github.rest.repos.createDeployment({
              ...context.repo, ref: context.sha, environment: 'development',
              production_environment: false, auto_merge: false, required_contexts: [],
              payload: {
                record_schema_version: 1,
                manifest_schema_version: manifest.schema_version,
                evidence_schema_version: evidence.schema_version,
                evidence_validated: true,
                workflow_run_id: context.runId,
                workflow_run_attempt: Number(process.env.RUN_ATTEMPT),
                release_commit: manifest.commit,
                release_manifest_digest: sha256(manifestBytes),
                verification_evidence_digest: sha256(evidenceBytes),
                backend_image: process.env.BACKEND_IMAGE,
                backend_image_digest: evidence.backend_image_digest,
                running_image_digest: evidence.running_image_digest,
                frontend_artifact_digest: evidence.frontend_artifact_digest,
                database_provider: evidence.database_provider,
                migration_runner: evidence.migration_runner,
                migration_id: evidence.migration_id,
                telemetry_enabled: evidence.telemetry_enabled,
                frontend_telemetry_enabled: evidence.frontend_telemetry_enabled,
                public_endpoint_health: evidence.public_endpoint_health,
                database_query_smoke: evidence.database_query_smoke,
              },
            })
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: deployment.data.id, state: 'success',
              environment: 'development', environment_url: process.env.ENVIRONMENT_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Development release and public verification passed',
            })
