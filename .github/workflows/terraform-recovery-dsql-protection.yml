name: Terraform recovery DSQL protection stage
run-name: PawLocal recovery DSQL protection stage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawlocal-infrastructure
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.10.5
  AWS_REGION: ${{ vars.AWS_REGION }}
  PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
  PAWLOCAL_TF_PLAN_BUCKET: ${{ vars.PAWLOCAL_TF_PLAN_BUCKET }}
  TF_PLAN_OBJECT_KEY: plans/recovery/${{ github.run_id }}/${{ github.run_attempt }}/tfplan

jobs:
  recovery-protection-plan:
    name: Plan exact legacy DSQL protection updates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.digest.outputs.plan_sha256 }}
    env:
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      PAWLOCAL_TERRAFORM_ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_RECOVERY_PLAN_ROLE_ARN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      TF_VAR_certificate_arn: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_VAR_terraform_state_bucket_name: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      TF_VAR_recovery_disable_dsql_deletion_protection: "true"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate recovery plan configuration
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$PAWLOCAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$PAWLOCAL_TERRAFORM_ROLE_ARN" =~ ^arn:[^:]+:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/pawlocal-terraform-recovery-plan$ ]]
          test -n "$AWS_REGION" && test -n "$PAWLOCAL_TF_STATE_BUCKET" && test -n "$PAWLOCAL_TF_PLAN_BUCKET"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure recovery plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PAWLOCAL_TERRAFORM_ROLE_ARN }}
          role-session-name: pawlocal-recovery-protection-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize legacy state and create the DSQL protection plan
        working-directory: infra/terraform
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" \
            -backend-config='key=pawlocal/terraform.tfstate' \
            -backend-config="region=${AWS_REGION}" \
            -backend-config='use_lockfile=true' > "$RUNNER_TEMP/recovery-protection-init.log" 2>&1
          if ! terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan > "$RUNNER_TEMP/recovery-protection-plan.log" 2>&1; then
            echo 'DSQL protection plan failed; raw provider output was withheld.' >&2
            exit 1
          fi

      - name: Publish exact sanitized DSQL changes
        working-directory: infra/terraform
        shell: bash
        run: |
          set -o pipefail
          {
            echo '## Legacy DSQL deletion-protection change review'
            echo
            echo 'This stage changes only the two tracked DSQL clusters from deletion protection enabled to disabled. Recovery destroy is a separate workflow and requires a separate review.'
            echo 'The exact-plan apply is intentionally disabled until a separate recovery policy change grants only the reviewed cluster updates and passes independent review.'
            if ! terraform show -json tfplan 2>"$RUNNER_TEMP/recovery-protection-show-error.log" | python ../../ops/terraform-recovery-protection-review.py; then
              echo 'DSQL protection plan failed sanitized review; raw output was withheld.' >&2
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Calculate exact saved-plan digest
        id: digest
        working-directory: infra/terraform
        shell: bash
        run: |
          digest="$(sha256sum tfplan | cut -d ' ' -f 1)"
          echo "plan_sha256=${digest}" >> "$GITHUB_OUTPUT"

      - name: Store the exact saved plan in private S3
        env:
          PLAN_SHA256: ${{ steps.digest.outputs.plan_sha256 }}
        run: |
          python -m pip install --disable-pip-version-check boto3==1.35.99
          python ops/terraform-plan-object.py upload \
            --bucket "$PAWLOCAL_TF_PLAN_BUCKET" --key "$TF_PLAN_OBJECT_KEY" \
            --file infra/terraform/tfplan --environment recovery \
            --state-key pawlocal/terraform.tfstate --commit "$GITHUB_SHA" \
            --repository-id "$GITHUB_REPOSITORY_ID" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --sha256 "$PLAN_SHA256"

  recovery-protection-apply:
    name: DSQL protection apply (blocked pending scoped policy review)
    needs: recovery-protection-plan
    # actionlint-disable if-cond
    if: false
    runs-on: ubuntu-latest
    environment: terraform-recovery-apply
    permissions:
      contents: read
      id-token: write
    env:
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      PAWLOCAL_TERRAFORM_ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_ROLE_ARN }}
    steps:
      - name: Check out planned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact recovery apply role
        shell: bash
        run: |
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$PAWLOCAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$PAWLOCAL_TERRAFORM_ROLE_ARN" =~ ^arn:[^:]+:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/pawlocal-terraform-recovery-apply$ ]]

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure protected recovery apply role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PAWLOCAL_TERRAFORM_ROLE_ARN }}
          role-session-name: pawlocal-recovery-protection-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download and verify exact reviewed plan
        env:
          EXPECTED_PLAN_SHA256: ${{ needs.recovery-protection-plan.outputs.plan_sha256 }}
        run: |
          python -m pip install --disable-pip-version-check boto3==1.35.99
          python ops/terraform-plan-object.py download \
            --bucket "$PAWLOCAL_TF_PLAN_BUCKET" --key "$TF_PLAN_OBJECT_KEY" \
            --file infra/terraform/tfplan --environment recovery \
            --state-key pawlocal/terraform.tfstate --commit "$GITHUB_SHA" \
            --repository-id "$GITHUB_REPOSITORY_ID" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --sha256 "$EXPECTED_PLAN_SHA256"

      - name: Initialize legacy shared state
        working-directory: infra/terraform
        shell: bash
        run: terraform init -input=false -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" -backend-config='key=pawlocal/terraform.tfstate' -backend-config="region=${AWS_REGION}" -backend-config='use_lockfile=true'

      - name: Apply exact reviewed DSQL protection plan
        working-directory: infra/terraform
        shell: bash
        run: |
          if ! terraform apply -input=false -lock-timeout=5m -auto-approve tfplan > "$RUNNER_TEMP/recovery-protection-apply.log" 2>&1; then
            echo 'DSQL protection apply failed; raw provider output was withheld.' >&2
            exit 1
          fi
          echo 'Only the two exact DSQL protection changes in the reviewed saved plan were applied.' >> "$GITHUB_STEP_SUMMARY"
