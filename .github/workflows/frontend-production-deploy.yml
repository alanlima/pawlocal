name: Deprecated mock-backed frontend deployment (disabled)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "openapi.yaml"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - ".github/workflows/frontend-production-deploy.yml"
      - '!**/*.md'
      - '!**/*.mdx'
  workflow_dispatch:

permissions:
  contents: read

# Keep the retired workflow name and trigger paths so old links remain intelligible.
# This no-op job must not publish the mock-backed bundle to the production site.
jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This mock-backed production deployment is retired. Use the full-stack release workflows."
