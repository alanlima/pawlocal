name: Reconcile Environment configuration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Matching environment to reconcile
        required: true
        type: choice
        options: [development, production]
      mode:
        description: Audit synchronizes available values without release readiness
        default: audit
        type: choice
        options: [audit, enforce]
  workflow_call:
    outputs:
      configuration:
        value: ${{ jobs.reconcile.outputs.configuration }}
      frontend_config:
        value: ${{ jobs.reconcile.outputs.frontend_config }}
    secrets:
      PAWLOCAL_CONFIG_GITHUB_TOKEN:
        description: Scoped credential resolved in the matching protected apply Environment
        required: true
    inputs:
      environment:
        required: true
        type: string
      mode:
        default: audit
        type: string
      caller_holds_lifecycle_lock:
        description: Caller already serializes the full environment lifecycle
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.caller_holds_lifecycle_lock && format('pawlocal-reconcile-call-{0}', github.run_id) || format('pawlocal-lifecycle-{0}', inputs.environment) }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate request
        env:
          SELECTED_ENVIRONMENT: ${{ inputs.environment }}
          SELECTED_MODE: ${{ inputs.mode }}
        run: |
          [[ "$SELECTED_ENVIRONMENT" =~ ^(development|production)$ ]]
          [[ "$SELECTED_MODE" =~ ^(audit|enforce)$ ]]
      - name: Report incomplete request validation
        if: failure() || cancelled()
        run: |
          printf '%s\n' '# Configuration reconciliation' '' '**INCOMPLETE: request validation did not complete.**' 'Reconciliation did not start; mapping inventory and destination outcomes are unavailable.' 'No readiness or successful mutation is claimed.' '' '> **Secrets:** GitHub does not return secret values. A successful secret API write confirms acceptance, not a readback or content comparison. Secret values cannot be verified as unchanged.' >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ format('{0}-apply', inputs.environment) }}
    concurrency:
      group: pawlocal-configuration-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      configuration: ${{ steps.sync.outputs.configuration }}
      frontend_config: ${{ steps.sync.outputs.frontend_config }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_CONFIG_READER_ROLE_ARN: ${{ vars.PAWLOCAL_CONFIG_READER_ROLE_ARN }}
      SELECTED_ENVIRONMENT: ${{ inputs.environment }}
      SELECTED_MODE: ${{ inputs.mode }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate entry configuration
        env:
          PAWLOCAL_CONFIG_GITHUB_TOKEN: ${{ secrets.PAWLOCAL_CONFIG_GITHUB_TOKEN }}
        run: |
          test -n "$PAWLOCAL_CONFIG_GITHUB_TOKEN" || { echo "Missing protected reconciliation credential" >&2; exit 1; }
          test -n "$AWS_REGION"
          [[ "$PAWLOCAL_CONFIG_READER_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/pawlocal-${SELECTED_ENVIRONMENT}-configuration-reader$ ]]
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install reconciler dependencies
        run: python -m pip install --disable-pip-version-check -r ops/configuration/requirements.txt
      - name: Assume exact configuration-reader role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PAWLOCAL_CONFIG_READER_ROLE_ARN }}
          role-session-name: configuration-${{ github.run_id }}
          # Account IDs in the verified public outputs are configuration, not secrets.
          mask-aws-account-id: false
      - name: Reconcile available configuration
        id: sync
        env:
          CONFIG_SUMMARY_PATH: ${{ runner.temp }}/configuration-summary.md
          PAWLOCAL_CONFIG_GITHUB_TOKEN: ${{ secrets.PAWLOCAL_CONFIG_GITHUB_TOKEN }}
        run: python ops/configuration/reconcile.py --environment "$SELECTED_ENVIRONMENT" --mode "$SELECTED_MODE"
      - name: Publish configuration job summary
        if: always()
        env:
          CONFIG_SUMMARY_PATH: ${{ runner.temp }}/configuration-summary.md
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          REPORT_WRITTEN: ${{ steps.sync.outputs.summary_written }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f ops/configuration/job_summary.py ]] && python ops/configuration/job_summary.py --environment "$SELECTED_ENVIRONMENT" --mode "$SELECTED_MODE"; then
            exit 0
          fi
          printf '%s\n' '# Configuration reconciliation' '' '**INCOMPLETE: summary helper unavailable or publication failed.**' 'Destination outcomes are unavailable; writes may have occurred. No readiness is claimed.' '' '> **Secrets:** GitHub does not return secret values. A successful secret API write confirms acceptance, not a readback or content comparison. Secret values cannot be verified as unchanged.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
