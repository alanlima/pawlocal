name: Seed development Aurora DSQL

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pawlocal-development-dsql-seed
  cancel-in-progress: false

jobs:
  seed:
    name: Seed and verify development records
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development-seed
    env:
      AWS_REGION: ap-southeast-2
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      PAWLOCAL_DSQL_SEED_ROLE_ARN: ${{ vars.PAWLOCAL_DSQL_SEED_ROLE_ARN }}
      PAWLOCAL_DSQL_ENDPOINT: ${{ secrets.PAWLOCAL_DSQL_ENDPOINT }}
      PAWLOCAL_EXPECTED_DSQL_ENDPOINT: ${{ secrets.PAWLOCAL_DSQL_ENDPOINT }}
      PAWLOCAL_DATABASE_URL: ${{ format('auroradsql+psycopg://pawlocal_development_app@{0}/postgres?application_name=pawlocal-development', secrets.PAWLOCAL_DSQL_ENDPOINT) }}
      PAWLOCAL_API_HEALTH_URL: ${{ vars.PAWLOCAL_API_HEALTH_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm the development-only target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Seed workflow must run from main." >&2; exit 1; }
          [[ "$PAWLOCAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "Development AWS account ID is missing or invalid." >&2; exit 1; }
          [[ "$PAWLOCAL_DSQL_SEED_ROLE_ARN" == "arn:aws:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/pawlocal-development-dsql-runtime" ]] || { echo "Seed role must be the development DSQL runtime role in the configured account." >&2; exit 1; }
          [[ "$PAWLOCAL_DSQL_ENDPOINT" =~ ^[a-z0-9-]+\.dsql\.ap-southeast-2\.on\.aws$ ]] || { echo "Endpoint must be an Aurora DSQL endpoint in ap-southeast-2." >&2; exit 1; }
          [[ "$PAWLOCAL_API_HEALTH_URL" == https://* ]] || { echo "Development API health URL must use HTTPS." >&2; exit 1; }
          echo "Target guards passed for the development account, role, endpoint, and HTTPS API URL."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend runtime dependencies
        run: python -m pip install -e ./backend

      - name: Configure development app-role credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PAWLOCAL_DSQL_SEED_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-session-name: PawLocalDevSeed-${{ github.run_id }}

      - name: Seed the fixed development catalog
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pawlocal-development-seed"
          python -m pawlocal.seed_places --environment development --catalog data/seed_places.json | tee "$RUNNER_TEMP/pawlocal-development-seed/seed-outcome.txt"

      - name: Verify seeded records through development API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pawlocal-development-seed"
          python ops/validate-seeded-places.py \
            "$PAWLOCAL_API_HEALTH_URL" \
            backend/data/seed_places.json \
            "$RUNNER_TEMP/pawlocal-development-seed/api-verification.json"
          cat "$RUNNER_TEMP/pawlocal-development-seed/api-verification.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload seed outcome and API verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawlocal-development-dsql-seed-${{ github.run_id }}
          path: ${{ runner.temp }}/pawlocal-development-seed/
          if-no-files-found: warn
          retention-days: 30
