name: Terraform current stack operations
run-name: PawLocal Terraform ${{ inputs.operation }} on the combined stack

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Apply the current root or tear down the current combined stack.
        required: true
        type: choice
        options:
          - apply
          - destroy
      confirmation:
        description: Type APPLY PAWLOCAL or DESTROY PAWLOCAL to match the selected operation.
        required: true
        type: string

permissions:
  contents: read

# This temporary workflow owns the existing combined-state root only. Do not
# cancel an active Terraform operation or run environment promotion here.
concurrency:
  # Match the release and rollback jobs that also apply against this state.
  group: pawlocal-lightsail-deploy
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.10.5
  TF_STATE_KEY: pawlocal/terraform.tfstate

jobs:
  validate-request:
    name: Validate protected operation request
    runs-on: ubuntu-latest
    steps:
      - name: Require main and matching confirmation
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'This workflow may only run from main.' >&2
            exit 1
          }
          case "$OPERATION:$CONFIRMATION" in
            apply:'APPLY PAWLOCAL'|destroy:'DESTROY PAWLOCAL') ;;
            *) echo 'Confirmation does not match the selected operation.' >&2; exit 1 ;;
          esac

  plan:
    name: Plan apply or teardown preparation
    needs: validate-request
    runs-on: ubuntu-latest
    environment: infrastructure-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.metadata.outputs.plan_sha256 }}
      plan_stage: ${{ steps.metadata.outputs.plan_stage }}
    env:
      PLAN_TRANSFER_BUCKET: ${{ vars.PAWLOCAL_TERRAFORM_PLAN_BUCKET }}
      TERRAFORM_ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_PLAN_ROLE_ARN }}
      TERRAFORM_ROLE_VARIABLE_NAME: PAWLOCAL_TERRAFORM_PLAN_ROLE_ARN
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      PAWLOCAL_DOMAIN_NAME: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      PAWLOCAL_CERTIFICATE_ARN: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      TF_VAR_certificate_arn: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_VAR_terraform_state_bucket_name: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      TF_VAR_dsql_bootstrap_python: /usr/bin/python3
      TF_VAR_enable_dsql_auth_event_capture: "false"
      TF_VAR_force_destroy_on_teardown: ${{ inputs.operation == 'destroy' && 'true' || 'false' }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate required environment configuration
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          require_env() {
            local name="$1"
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Environment variable: ${name}" >&2
              exit 1
            fi
          }
          require_env AWS_REGION
          require_env PAWLOCAL_TF_STATE_BUCKET
          require_env PAWLOCAL_DOMAIN_NAME
          require_env PAWLOCAL_CERTIFICATE_ARN
          require_env PLAN_TRANSFER_BUCKET
          if [[ -z "$TERRAFORM_ROLE_ARN" ]]; then
            echo "Missing required GitHub Environment variable: ${TERRAFORM_ROLE_VARIABLE_NAME}" >&2
            exit 1
          fi
          if [[ ! "$PAWLOCAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo 'Invalid or missing GitHub Environment variable: PAWLOCAL_AWS_ACCOUNT_ID (expected 12 digits).' >&2
            exit 1
          fi
          if [[ "$TERRAFORM_ROLE_ARN" != "arn:aws:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "Invalid GitHub Environment variable: ${TERRAFORM_ROLE_VARIABLE_NAME} must belong to PAWLOCAL_AWS_ACCOUNT_ID." >&2
            exit 1
          fi

      - name: Configure AWS credentials and verify the live account
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          allowed-account-ids: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: "true"

      - name: Require the configured AWS account
        shell: bash
        env:
          ACTUAL_AWS_ACCOUNT_ID: ${{ steps.aws-credentials.outputs.aws-account-id }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
        run: |
          [[ "$ACTUAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ && "$ACTUAL_AWS_ACCOUNT_ID" == "$EXPECTED_AWS_ACCOUNT_ID" ]] || {
            echo 'AWS credentials do not resolve to the configured account.' >&2
            exit 1
          }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize existing combined state
        working-directory: infra/terraform
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config='encrypt=true' \
            -backend-config='use_lockfile=true' > "$RUNNER_TEMP/terraform-init.log" 2>&1 || {
              echo 'Terraform initialization failed; raw provider output was withheld.' >&2
              exit 1
            }

      - name: Export backend image digests from current Terraform outputs
        working-directory: infra/terraform
        shell: bash
        run: |
          terraform output -json environment_targets > "$RUNNER_TEMP/environment-targets.json" 2>"$RUNNER_TEMP/terraform-output.log" || {
            echo 'Unable to read current environment targets from Terraform state.' >&2
            exit 1
          }
          python ../../.github/scripts/export-backend-image-digests.py "$RUNNER_TEMP/environment-targets.json"

      - name: Create read-only refresh snapshot for destroy preparation
        if: inputs.operation == 'destroy'
        working-directory: infra/terraform
        shell: bash
        run: |
          if terraform plan -refresh-only -input=false -lock-timeout=5m -no-color \
            -out="$RUNNER_TEMP/terraform-refresh-only.tfplan" \
            > "$RUNNER_TEMP/terraform-refresh-only.log" 2>&1; then
            :
          else
            echo 'Terraform refresh-only planning failed. Sanitized diagnostic summary:' >&2
            python ../../.github/scripts/terraform-plan-diagnostic.py "$RUNNER_TEMP/terraform-refresh-only.log" >&2
            exit 1
          fi
          terraform show -json "$RUNNER_TEMP/terraform-refresh-only.tfplan" \
            > "$RUNNER_TEMP/terraform-refresh-only.json" \
            2> "$RUNNER_TEMP/terraform-refresh-only-show.log" || {
              echo 'Terraform refresh-only plan could not be safely rendered; raw output was withheld.' >&2
              exit 1
            }

      - name: Create the requested plan
        id: plan
        working-directory: infra/terraform
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "$OPERATION" == apply ]]; then
            plan_stage=apply
          else
            # This first approved apply records the provider's teardown-only
            # force_destroy behavior in state. It does not delete resources.
            plan_stage=destroy-prepare
          fi
          if terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan > "$RUNNER_TEMP/terraform-plan.log" 2>&1; then
            :
          else
            echo 'Terraform planning failed. Sanitized diagnostic summary:' >&2
            python ../../.github/scripts/terraform-plan-diagnostic.py "$RUNNER_TEMP/terraform-plan.log" >&2
            exit 1
          fi
          echo "plan_stage=$plan_stage" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized resource and action summary
        working-directory: infra/terraform
        shell: bash
        env:
          PLAN_MODE: ${{ steps.plan.outputs.plan_stage == 'destroy' && 'destroy' || 'apply' }}
          PLAN_STAGE: ${{ steps.plan.outputs.plan_stage }}
        run: |
          terraform show -json tfplan > "$RUNNER_TEMP/terraform-plan.json" 2>"$RUNNER_TEMP/terraform-show.log" || {
            echo 'Terraform plan could not be safely rendered; raw output was withheld.' >&2
            exit 1
          }
          if [[ "$PLAN_STAGE" == destroy-prepare ]]; then
            python ../../.github/scripts/terraform-refresh-diagnostic.py \
              "$RUNNER_TEMP/terraform-refresh-only.json" \
              "$RUNNER_TEMP/terraform-plan.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          python ../../.github/scripts/terraform-plan-gate.py "$RUNNER_TEMP/terraform-plan.json" >> "$GITHUB_STEP_SUMMARY"

# Temporarily disabled for this teardown; review and restore later if relevant.
# - name: Enforce strict teardown-preparation change guard
#   if: steps.plan.outputs.plan_stage == 'destroy-prepare'
#   working-directory: infra/terraform
#   shell: bash
#   run: python ../../.github/scripts/terraform-plan-gate.py "$RUNNER_TEMP/terraform-plan.json" --destroy-prepare-guard

      - name: Bind exact plan metadata
        id: metadata
        working-directory: infra/terraform
        shell: bash
        env:
          PLAN_STAGE: ${{ steps.plan.outputs.plan_stage }}
          OPERATION: ${{ inputs.operation }}
        run: |
          digest="$(sha256sum tfplan | cut -d ' ' -f 1)"
          python - "$PLAN_STAGE" "$OPERATION" "$digest" <<'PY'
          import json, os, sys
          stage, operation, digest = sys.argv[1:]
          value = {
              "stage": stage,
              "operation": operation,
              "sha256": digest,
              "commit": os.environ["GITHUB_SHA"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "state_key": os.environ["TF_STATE_KEY"],
              "account_id": os.environ["PAWLOCAL_AWS_ACCOUNT_ID"],
          }
          with open("plan-metadata.json", "w", encoding="utf-8") as target:
              json.dump(value, target, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as target:
              target.write(f"plan_sha256={digest}\n")
              target.write(f"plan_stage={stage}\n")
          PY
          printf 'Exact plan SHA-256: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact saved plan to private transfer bucket
        working-directory: infra/terraform
        shell: bash
        env:
          PLAN_STAGE: ${{ steps.plan.outputs.plan_stage }}
        run: |
          test -n "$PLAN_TRANSFER_BUCKET"
          python -m pip install --disable-pip-version-check --no-warn-script-location -r ../../.github/scripts/requirements-terraform-plan-transfer.txt
          python ../../.github/scripts/terraform-plan-transfer.py upload "$PLAN_TRANSFER_BUCKET" "plans/legacy/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${PLAN_STAGE}" tfplan plan-metadata.json

  apply:
    name: Apply reviewed exact plan
    if: inputs.operation == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    environment: infrastructure-apply
    permissions:
      contents: read
      id-token: write
    env:
      PLAN_TRANSFER_BUCKET: ${{ vars.PAWLOCAL_TERRAFORM_PLAN_BUCKET }}
      TERRAFORM_ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN }}
      TERRAFORM_ROLE_VARIABLE_NAME: PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      PAWLOCAL_DOMAIN_NAME: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      PAWLOCAL_CERTIFICATE_ARN: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      TF_VAR_certificate_arn: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_VAR_terraform_state_bucket_name: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      TF_VAR_dsql_bootstrap_python: /usr/bin/python3
      TF_VAR_enable_dsql_auth_event_capture: "false"
      TF_VAR_force_destroy_on_teardown: "false"
    steps:
      - name: Check out the planned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate required role and plan bucket variables
        shell: bash
        run: |
          require_env() {
            local name="$1"
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Environment variable: ${name}" >&2
              exit 1
            fi
          }
          for name in AWS_REGION PAWLOCAL_AWS_ACCOUNT_ID PAWLOCAL_TF_STATE_BUCKET PAWLOCAL_DOMAIN_NAME PAWLOCAL_CERTIFICATE_ARN PLAN_TRANSFER_BUCKET; do
            require_env "$name"
          done
          if [[ -z "$TERRAFORM_ROLE_ARN" ]]; then
            echo "Missing required GitHub Environment variable: ${TERRAFORM_ROLE_VARIABLE_NAME}" >&2
            exit 1
          fi
          if [[ ! "$PAWLOCAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo 'Invalid or missing GitHub Environment variable: PAWLOCAL_AWS_ACCOUNT_ID (expected 12 digits).' >&2
            exit 1
          fi
          if [[ "$TERRAFORM_ROLE_ARN" != "arn:aws:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "Invalid GitHub Environment variable: ${TERRAFORM_ROLE_VARIABLE_NAME} must belong to PAWLOCAL_AWS_ACCOUNT_ID." >&2
            exit 1
          fi

      - name: Configure AWS credentials and verify the live account
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          allowed-account-ids: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: "true"

      - name: Require the configured AWS account
        shell: bash
        env:
          ACTUAL_AWS_ACCOUNT_ID: ${{ steps.aws-credentials.outputs.aws-account-id }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
        run: |
          [[ "$ACTUAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ && "$ACTUAL_AWS_ACCOUNT_ID" == "$EXPECTED_AWS_ACCOUNT_ID" ]] || {
            echo 'AWS credentials do not resolve to the configured account.' >&2
            exit 1
          }

      - name: Download exact plan from private transfer bucket
        shell: bash
        run: |
          test -n "$PLAN_TRANSFER_BUCKET"
          python -m pip install --disable-pip-version-check --no-warn-script-location -r .github/scripts/requirements-terraform-plan-transfer.txt
          python .github/scripts/terraform-plan-transfer.py download "$PLAN_TRANSFER_BUCKET" "plans/legacy/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${{ needs.plan.outputs.plan_stage }}" plan plan-metadata.json

      - name: Verify plan metadata and digest
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
        run: |
          python - "$EXPECTED_SHA256" <<'PY'
          import hashlib, json, os, pathlib, sys
          expected = {
              "stage": "apply", "operation": "apply", "commit": os.environ["GITHUB_SHA"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"], "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "state_key": os.environ["TF_STATE_KEY"],
              "account_id": os.environ["PAWLOCAL_AWS_ACCOUNT_ID"],
          }
          path = pathlib.Path("plan/plan-metadata.json")
          metadata = json.loads(path.read_text(encoding="utf-8"))
          if any(metadata.get(key) != value for key, value in expected.items()):
              raise SystemExit("Saved plan metadata does not match this approved run")
          digest = hashlib.sha256(pathlib.Path("plan/tfplan").read_bytes()).hexdigest()
          if digest != sys.argv[1] or digest != metadata.get("sha256"):
              raise SystemExit("Saved Terraform plan digest mismatch")
          PY

      - name: Set up Terraform and initialize current state
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize existing combined state
        working-directory: infra/terraform
        shell: bash
        run: terraform init -input=false -reconfigure -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config='encrypt=true' -backend-config='use_lockfile=true'

      - name: Export backend image digests from current Terraform outputs
        working-directory: infra/terraform
        shell: bash
        run: |
          terraform output -json environment_targets > "$RUNNER_TEMP/environment-targets.json" 2>"$RUNNER_TEMP/terraform-output.log" || {
            echo 'Unable to read current environment targets from Terraform state.' >&2
            exit 1
          }
          python ../../.github/scripts/export-backend-image-digests.py "$RUNNER_TEMP/environment-targets.json"

      - name: Apply exact reviewed plan
        working-directory: infra/terraform
        shell: bash
        run: terraform apply -input=false -lock-timeout=5m -auto-approve ../../plan/tfplan

  prepare-destroy:
    name: Apply approved teardown preparation
    if: inputs.operation == 'destroy'
    needs: plan
    runs-on: ubuntu-latest
    environment: infrastructure-apply
    permissions:
      contents: read
      id-token: write
    env:
      PLAN_TRANSFER_BUCKET: ${{ vars.PAWLOCAL_TERRAFORM_PLAN_BUCKET }}
      TERRAFORM_ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN }}
      TERRAFORM_ROLE_VARIABLE_NAME: PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      PAWLOCAL_DOMAIN_NAME: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      PAWLOCAL_CERTIFICATE_ARN: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      TF_VAR_certificate_arn: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_VAR_terraform_state_bucket_name: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      TF_VAR_dsql_bootstrap_python: /usr/bin/python3
      TF_VAR_enable_dsql_auth_event_capture: "false"
      TF_VAR_force_destroy_on_teardown: "true"
    steps:
      - name: Check out the planned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate required role and plan bucket variables
        shell: bash
        run: |
          require_env() {
            local name="$1"
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Environment variable: ${name}" >&2
              exit 1
            fi
          }
          for name in AWS_REGION PAWLOCAL_AWS_ACCOUNT_ID PAWLOCAL_TF_STATE_BUCKET PAWLOCAL_DOMAIN_NAME PAWLOCAL_CERTIFICATE_ARN PLAN_TRANSFER_BUCKET; do
            require_env "$name"
          done
          if [[ -z "$TERRAFORM_ROLE_ARN" ]]; then
            echo "Missing required GitHub Environment variable: ${TERRAFORM_ROLE_VARIABLE_NAME}" >&2
            exit 1
          fi
          if [[ ! "$PAWLOCAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo 'Invalid or missing GitHub Environment variable: PAWLOCAL_AWS_ACCOUNT_ID (expected 12 digits).' >&2
            exit 1
          fi
          if [[ "$TERRAFORM_ROLE_ARN" != "arn:aws:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "Invalid GitHub Environment variable: ${TERRAFORM_ROLE_VARIABLE_NAME} must belong to PAWLOCAL_AWS_ACCOUNT_ID." >&2
            exit 1
          fi

      - name: Configure AWS credentials and verify the live account
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          allowed-account-ids: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: "true"

      - name: Require the configured AWS account
        shell: bash
        env:
          ACTUAL_AWS_ACCOUNT_ID: ${{ steps.aws-credentials.outputs.aws-account-id }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
        run: |
          [[ "$ACTUAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ && "$ACTUAL_AWS_ACCOUNT_ID" == "$EXPECTED_AWS_ACCOUNT_ID" ]] || {
            echo 'AWS credentials do not resolve to the configured account.' >&2
            exit 1
          }

      - name: Download exact plan from private transfer bucket
        shell: bash
        run: |
          test -n "$PLAN_TRANSFER_BUCKET"
          python -m pip install --disable-pip-version-check --no-warn-script-location -r .github/scripts/requirements-terraform-plan-transfer.txt
          python .github/scripts/terraform-plan-transfer.py download "$PLAN_TRANSFER_BUCKET" "plans/legacy/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${{ needs.plan.outputs.plan_stage }}" plan plan-metadata.json

      - name: Verify plan metadata and digest
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
        run: |
          python - "$EXPECTED_SHA256" <<'PY'
          import hashlib, json, os, pathlib, sys
          expected = {
              "stage": "destroy-prepare", "operation": "destroy", "commit": os.environ["GITHUB_SHA"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"], "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "state_key": os.environ["TF_STATE_KEY"],
              "account_id": os.environ["PAWLOCAL_AWS_ACCOUNT_ID"],
          }
          metadata = json.loads(pathlib.Path("plan/plan-metadata.json").read_text(encoding="utf-8"))
          if any(metadata.get(key) != value for key, value in expected.items()):
              raise SystemExit("Saved plan metadata does not match this approved run")
          digest = hashlib.sha256(pathlib.Path("plan/tfplan").read_bytes()).hexdigest()
          if digest != sys.argv[1] or digest != metadata.get("sha256"):
              raise SystemExit("Saved Terraform plan digest mismatch")
          PY

      - name: Set up Terraform and initialize current state
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize existing combined state
        working-directory: infra/terraform
        shell: bash
        run: terraform init -input=false -reconfigure -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config='encrypt=true' -backend-config='use_lockfile=true'

      - name: Export backend image digests from current Terraform outputs
        working-directory: infra/terraform
        shell: bash
        run: |
          terraform output -json environment_targets > "$RUNNER_TEMP/environment-targets.json" 2>"$RUNNER_TEMP/terraform-output.log" || {
            echo 'Unable to read current environment targets from Terraform state.' >&2
            exit 1
          }
          python ../../.github/scripts/export-backend-image-digests.py "$RUNNER_TEMP/environment-targets.json"

      - name: Apply exact teardown preparation plan
        working-directory: infra/terraform
        shell: bash
        run: terraform apply -input=false -lock-timeout=5m -auto-approve ../../plan/tfplan

      - name: Note deferred IAM bootstrap ownership work
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### IAM/bootstrap ownership deferred until recreation

          The existing `destroy = false` lifecycle block leaves the development GitHub publisher role in AWS when the app state releases it; this destroy does not remove that role. IAM/bootstrap ownership work is deferred until recreation. The development application runtime role remains managed by the fullstack app module and is handled by the full destroy plan.
          EOF

  destroy-plan:
    name: Plan destruction of the combined stack
    if: inputs.operation == 'destroy'
    needs: prepare-destroy
    runs-on: ubuntu-latest
    environment: infrastructure-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.metadata.outputs.plan_sha256 }}
    env:
      PLAN_TRANSFER_BUCKET: ${{ vars.PAWLOCAL_TERRAFORM_PLAN_BUCKET }}
      TERRAFORM_ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_PLAN_ROLE_ARN }}
      TERRAFORM_ROLE_VARIABLE_NAME: PAWLOCAL_TERRAFORM_PLAN_ROLE_ARN
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      PAWLOCAL_DOMAIN_NAME: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      PAWLOCAL_CERTIFICATE_ARN: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      TF_VAR_certificate_arn: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_VAR_terraform_state_bucket_name: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      TF_VAR_dsql_bootstrap_python: /usr/bin/python3
      TF_VAR_enable_dsql_auth_event_capture: "false"
      TF_VAR_force_destroy_on_teardown: "true"
    steps:
      - name: Check out the same approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate required role and plan bucket variables
        shell: bash
        run: |
          require_env() {
            local name="$1"
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Environment variable: ${name}" >&2
              exit 1
            fi
          }
          for name in AWS_REGION PAWLOCAL_AWS_ACCOUNT_ID PAWLOCAL_TF_STATE_BUCKET PAWLOCAL_DOMAIN_NAME PAWLOCAL_CERTIFICATE_ARN PLAN_TRANSFER_BUCKET; do
            require_env "$name"
          done
          if [[ -z "$TERRAFORM_ROLE_ARN" ]]; then
            echo "Missing required GitHub Environment variable: ${TERRAFORM_ROLE_VARIABLE_NAME}" >&2
            exit 1
          fi
          if [[ ! "$PAWLOCAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo 'Invalid or missing GitHub Environment variable: PAWLOCAL_AWS_ACCOUNT_ID (expected 12 digits).' >&2
            exit 1
          fi
          if [[ "$TERRAFORM_ROLE_ARN" != "arn:aws:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "Invalid GitHub Environment variable: ${TERRAFORM_ROLE_VARIABLE_NAME} must belong to PAWLOCAL_AWS_ACCOUNT_ID." >&2
            exit 1
          fi

      - name: Configure AWS credentials and verify the live account
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          allowed-account-ids: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: "true"

      - name: Require the configured AWS account
        shell: bash
        env:
          ACTUAL_AWS_ACCOUNT_ID: ${{ steps.aws-credentials.outputs.aws-account-id }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
        run: |
          [[ "$ACTUAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ && "$ACTUAL_AWS_ACCOUNT_ID" == "$EXPECTED_AWS_ACCOUNT_ID" ]] || {
            echo 'AWS credentials do not resolve to the configured account.' >&2
            exit 1
          }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize existing combined state
        working-directory: infra/terraform
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config='encrypt=true' \
            -backend-config='use_lockfile=true' > "$RUNNER_TEMP/terraform-init.log" 2>&1 || {
              echo 'Terraform initialization failed; raw provider output was withheld.' >&2
              exit 1
            }

      - name: Export backend image digests from current Terraform outputs
        working-directory: infra/terraform
        shell: bash
        run: |
          terraform output -json environment_targets > "$RUNNER_TEMP/environment-targets.json" 2>"$RUNNER_TEMP/terraform-output.log" || {
            echo 'Unable to read current environment targets from Terraform state.' >&2
            exit 1
          }
          python ../../.github/scripts/export-backend-image-digests.py "$RUNNER_TEMP/environment-targets.json"

      - name: Plan full destruction
        working-directory: infra/terraform
        shell: bash
        run: |
          if terraform plan -destroy -input=false -lock-timeout=5m -no-color -out=tfplan > "$RUNNER_TEMP/terraform-destroy-plan.log" 2>&1; then
            :
          else
            echo 'Terraform destroy planning failed. Sanitized diagnostic summary:' >&2
            python ../../.github/scripts/terraform-plan-diagnostic.py "$RUNNER_TEMP/terraform-destroy-plan.log" >&2
            exit 1
          fi

      - name: Publish sanitized destroy summary
        working-directory: infra/terraform
        shell: bash
        env:
          PLAN_MODE: destroy
        run: |
          terraform show -json tfplan > "$RUNNER_TEMP/terraform-destroy-plan.json" 2>"$RUNNER_TEMP/terraform-show.log" || {
            echo 'Terraform destroy plan could not be safely rendered; raw output was withheld.' >&2
            exit 1
          }
          python ../../.github/scripts/terraform-plan-gate.py "$RUNNER_TEMP/terraform-destroy-plan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Bind exact destroy plan metadata
        id: metadata
        working-directory: infra/terraform
        shell: bash
        run: |
          digest="$(sha256sum tfplan | cut -d ' ' -f 1)"
          python - "$digest" <<'PY'
          import json, os, sys
          value = {
              "stage": "destroy", "operation": "destroy", "sha256": sys.argv[1],
              "commit": os.environ["GITHUB_SHA"], "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "state_key": os.environ["TF_STATE_KEY"],
              "account_id": os.environ["PAWLOCAL_AWS_ACCOUNT_ID"],
          }
          with open("destroy-plan-metadata.json", "w", encoding="utf-8") as target:
              json.dump(value, target, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as target:
              target.write(f"plan_sha256={sys.argv[1]}\n")
          PY
          printf 'Exact destroy plan SHA-256: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact destroy plan to private transfer bucket
        working-directory: infra/terraform
        shell: bash
        run: |
          test -n "$PLAN_TRANSFER_BUCKET"
          python -m pip install --disable-pip-version-check --no-warn-script-location -r ../../.github/scripts/requirements-terraform-plan-transfer.txt
          python ../../.github/scripts/terraform-plan-transfer.py upload "$PLAN_TRANSFER_BUCKET" "plans/legacy/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/destroy" tfplan destroy-plan-metadata.json

  destroy:
    name: Apply reviewed full-stack destroy
    if: inputs.operation == 'destroy'
    needs: destroy-plan
    runs-on: ubuntu-latest
    environment: infrastructure-apply
    permissions:
      contents: read
      id-token: write
    env:
      PLAN_TRANSFER_BUCKET: ${{ vars.PAWLOCAL_TERRAFORM_PLAN_BUCKET }}
      TERRAFORM_ROLE_ARN: ${{ vars.PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN }}
      TERRAFORM_ROLE_VARIABLE_NAME: PAWLOCAL_TERRAFORM_APPLY_ROLE_ARN
      AWS_REGION: ${{ vars.AWS_REGION }}
      PAWLOCAL_TF_STATE_BUCKET: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      PAWLOCAL_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
      PAWLOCAL_DOMAIN_NAME: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      PAWLOCAL_CERTIFICATE_ARN: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.PAWLOCAL_DOMAIN_NAME }}
      TF_VAR_certificate_arn: ${{ vars.PAWLOCAL_CERTIFICATE_ARN }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_VAR_terraform_state_bucket_name: ${{ vars.PAWLOCAL_TF_STATE_BUCKET }}
      TF_VAR_dsql_bootstrap_python: /usr/bin/python3
      TF_VAR_enable_dsql_auth_event_capture: "false"
      TF_VAR_force_destroy_on_teardown: "true"
    steps:
      - name: Check out the destroy-plan commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate required role and plan bucket variables
        shell: bash
        run: |
          require_env() {
            local name="$1"
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Environment variable: ${name}" >&2
              exit 1
            fi
          }
          for name in AWS_REGION PAWLOCAL_AWS_ACCOUNT_ID PAWLOCAL_TF_STATE_BUCKET PAWLOCAL_DOMAIN_NAME PAWLOCAL_CERTIFICATE_ARN PLAN_TRANSFER_BUCKET; do
            require_env "$name"
          done
          if [[ -z "$TERRAFORM_ROLE_ARN" ]]; then
            echo "Missing required GitHub Environment variable: ${TERRAFORM_ROLE_VARIABLE_NAME}" >&2
            exit 1
          fi
          if [[ ! "$PAWLOCAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo 'Invalid or missing GitHub Environment variable: PAWLOCAL_AWS_ACCOUNT_ID (expected 12 digits).' >&2
            exit 1
          fi
          if [[ "$TERRAFORM_ROLE_ARN" != "arn:aws:iam::${PAWLOCAL_AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "Invalid GitHub Environment variable: ${TERRAFORM_ROLE_VARIABLE_NAME} must belong to PAWLOCAL_AWS_ACCOUNT_ID." >&2
            exit 1
          fi

      - name: Configure AWS credentials and verify the live account
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          allowed-account-ids: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: "true"

      - name: Require the configured AWS account
        shell: bash
        env:
          ACTUAL_AWS_ACCOUNT_ID: ${{ steps.aws-credentials.outputs.aws-account-id }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.PAWLOCAL_AWS_ACCOUNT_ID }}
        run: |
          [[ "$ACTUAL_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ && "$ACTUAL_AWS_ACCOUNT_ID" == "$EXPECTED_AWS_ACCOUNT_ID" ]] || {
            echo 'AWS credentials do not resolve to the configured account.' >&2
            exit 1
          }

      - name: Download exact destroy plan from private transfer bucket
        shell: bash
        run: |
          test -n "$PLAN_TRANSFER_BUCKET"
          python -m pip install --disable-pip-version-check --no-warn-script-location -r .github/scripts/requirements-terraform-plan-transfer.txt
          python .github/scripts/terraform-plan-transfer.py download "$PLAN_TRANSFER_BUCKET" "plans/legacy/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/destroy" plan destroy-plan-metadata.json

      - name: Verify exact destroy plan metadata and digest
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.destroy-plan.outputs.plan_sha256 }}
        run: |
          python - "$EXPECTED_SHA256" <<'PY'
          import hashlib, json, os, pathlib, sys
          expected = {
              "stage": "destroy", "operation": "destroy", "commit": os.environ["GITHUB_SHA"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"], "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "state_key": os.environ["TF_STATE_KEY"],
              "account_id": os.environ["PAWLOCAL_AWS_ACCOUNT_ID"],
          }
          metadata = json.loads(pathlib.Path("plan/destroy-plan-metadata.json").read_text(encoding="utf-8"))
          if any(metadata.get(key) != value for key, value in expected.items()):
              raise SystemExit("Saved destroy plan metadata does not match this approved run")
          digest = hashlib.sha256(pathlib.Path("plan/tfplan").read_bytes()).hexdigest()
          if digest != sys.argv[1] or digest != metadata.get("sha256"):
              raise SystemExit("Saved Terraform destroy plan digest mismatch")
          PY

      - name: Set up Terraform and initialize current state
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize existing combined state
        working-directory: infra/terraform
        shell: bash
        run: terraform init -input=false -reconfigure -backend-config="bucket=${PAWLOCAL_TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config='encrypt=true' -backend-config='use_lockfile=true'

      - name: Apply exact reviewed destroy plan
        working-directory: infra/terraform
        shell: bash
        run: terraform apply -input=false -lock-timeout=5m -auto-approve ../../plan/tfplan
