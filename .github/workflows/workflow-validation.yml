name: Workflow validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "scripts/ci/**"
      - "tests/ci/**"
      - "ops/**"
      - '!**/*.md'
      - '!**/*.mdx'
      - "docs/github-actions.md"
      - "docs/terraform-greenfield-operations.md"
      - "docs/iam-bootstrap-actions.md"
      - "ops/iam-bootstrap/README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "scripts/ci/**"
      - "tests/ci/**"
      - "ops/**"
      - '!**/*.md'
      - '!**/*.mdx'
      - "docs/github-actions.md"
      - "docs/terraform-greenfield-operations.md"
      - "docs/iam-bootstrap-actions.md"
      - "ops/iam-bootstrap/README.md"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pawlocal-workflow-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  configuration-recovery:
    name: Reconciled frontend recovery fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install isolated fixture dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ops/configuration/requirements.txt
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Verify real rebuilt and served OAuth configuration
        run: |
          for environment in development production; do
            python ops/configuration/tests/run_frontend_recovery.py "$RUNNER_TEMP/config-recovery/$environment" --environment "$environment"
            node ops/configuration/tests/frontend-recovery.mjs "$RUNNER_TEMP/config-recovery/$environment/old.json" "$RUNNER_TEMP/config-recovery/$environment/replacement.json" "$environment"
          done

  action-runtime-smoke:
    name: External action runtime smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR without publishing
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image without loading or publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: pawlocal-action-runtime-smoke:test

      - name: Upload runtime policy evidence
        uses: actions/upload-artifact@v7
        with:
          name: action-runtime-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/ci/test_action_runtime_policy.py
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Workflow syntax, security, and path tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify GitHub Script Node.js runtime
        uses: actions/github-script@v9
        with:
          script: |
            if (!process.version.startsWith('v24.')) {
              core.setFailed(`Expected Node.js 24, received ${process.version}`)
            }

      - name: Install pinned YAML parser for policy tests
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Install pinned actionlint release
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Lint workflow syntax and security
        run: actionlint

      - name: Verify workflow trigger path cases
        # Bootstrap inventory admission uses the pinned HCL parser, not a
        # handwritten lexer that can mistake embedded templates for resources.
        # Install before importing its offline safety tests.
        run: |
          python -m pip install --disable-pip-version-check -r .github/scripts/requirements-iam-bootstrap.txt
          python -m unittest discover -s tests/ci -v

      - name: Install configuration reconciliation test dependencies
        run: python -m pip install --disable-pip-version-check -r ops/configuration/requirements.txt

      - name: Verify reconciliation behavior and non-disclosure
        run: python -m unittest discover -s ops/configuration/tests -v
