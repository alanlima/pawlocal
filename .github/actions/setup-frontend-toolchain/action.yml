name: Set up frontend toolchain
description: Install Node 22, reuse the frontend npm cache, and install locked frontend dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci
