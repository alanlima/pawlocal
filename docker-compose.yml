name: pawlocal-stage2

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    environment:
      VITE_TELEMETRY_ENABLED: ${PAWLOCAL_TELEMETRY_ENABLED:-true}
      VITE_OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      VITE_DEMO_FAULTS: ${PAWLOCAL_DEMO_FAULTS:-true}
      VITE_USE_MOCK_BACKEND: ${VITE_USE_MOCK_BACKEND:-true}
    ports:
      - "127.0.0.1:${PAWLOCAL_FRONTEND_PORT:-5173}:5173"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  otel-collector:
    build:
      context: .
      dockerfile: observability/healthcheck-images/otel-collector.Dockerfile
    image: pawlocal-stage2/otel-collector:0.136.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      PAWLOCAL_FRONTEND_ORIGIN: ${PAWLOCAL_FRONTEND_ORIGIN:-http://localhost:5173}
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  loki:
    build:
      context: .
      dockerfile: observability/healthcheck-images/loki.Dockerfile
    image: pawlocal-stage2/loki:3.5.3
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "/busybox-bin", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  tempo:
    build:
      context: .
      dockerfile: observability/healthcheck-images/tempo.Dockerfile
    image: pawlocal-stage2/tempo:2.8.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD", "/busybox-bin", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${PAWLOCAL_GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
